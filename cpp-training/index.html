<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>C++ Foundations</title>
  <meta name="description" content="An interactive C++ course for Higher Education computing students, from first program to object-oriented programming and file handling.">
  <!-- Fonts load from Google Fonts when online; the fallbacks in styles.css apply offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
/* ==========================================================================
   C++ Foundations — stylesheet
   Layout concept: an IDE-like shell. A top bar holds progress, a left rail
   lists every topic, and a readable centre column holds the lesson. Code
   panes always use the dark editor palette so syntax colours stay constant.
   ========================================================================== */

/* ---------- 1. Design tokens ---------- */
:root {
  /* Surfaces and text (light) */
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef3;
  --ink: #16202c;
  --muted: #525f70;
  --line: #d3dae3;

  /* Accent: a C++ steel blue */
  --accent: #0a58a6;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf9;

  /* Semantic colours (feedback and part types) */
  --good: #17784a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --warn: #8a5300;
  --warn-soft: #fbf0d9;
  --violet: #5f3dc4;
  --violet-soft: #ece7fb;
  --teal: #0b6e6e;
  --teal-soft: #ddf2f1;

  /* Editor palette (deliberately the same in both themes) */
  --code-bg: #1a2130;
  --code-bar: #232c3d;
  --code-fg: #dfe6ef;
  --code-gutter: #6f7d93;
  --code-hl: rgba(106, 174, 255, 0.16);
  --tk-kw: #f7a26a;
  --tk-type: #67c7ea;
  --tk-str: #a6da8b;
  --tk-num: #d4a9ff;
  --tk-com: #8a97ab;
  --tk-pre: #f394b2;
  --tk-fn: #ffd27a;
  --tk-ns: #a9bdd2;

  /* Type */
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;
  --step-3: 2.1rem;

  --radius: 8px;
  --topbar-h: 60px;
  --sidebar-w: 290px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 2px 8px rgba(16, 24, 40, 0.05);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c;
    --surface: #171f29;
    --surface-2: #1f2934;
    --ink: #e5eaf0;
    --muted: #9eabba;
    --line: #2d3947;
    --accent: #6fb0ff;
    --accent-ink: #0b1522;
    --accent-soft: #1a2c42;
    --good: #5fd394;
    --good-soft: #14301f;
    --bad: #ff8b80;
    --bad-soft: #3b1a19;
    --warn: #f2b84d;
    --warn-soft: #382a10;
    --violet: #b8a2ff;
    --violet-soft: #2a2245;
    --teal: #55d0c8;
    --teal-soft: #11302f;
    --code-bg: #0c1118;
    --code-bar: #161d28;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c;
  --surface: #171f29;
  --surface-2: #1f2934;
  --ink: #e5eaf0;
  --muted: #9eabba;
  --line: #2d3947;
  --accent: #6fb0ff;
  --accent-ink: #0b1522;
  --accent-soft: #1a2c42;
  --good: #5fd394;
  --good-soft: #14301f;
  --bad: #ff8b80;
  --bad-soft: #3b1a19;
  --warn: #f2b84d;
  --warn-soft: #382a10;
  --violet: #b8a2ff;
  --violet-soft: #2a2245;
  --teal: #55d0c8;
  --teal-soft: #11302f;
  --code-bg: #0c1118;
  --code-bar: #161d28;
  --shadow: none;
  color-scheme: dark;
}

/* ---------- 2. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  /* No ligatures: students must see <=, << and ++ exactly as they will type them. */
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "calt" 0;
}
input, textarea, select, button { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: var(--step-2); font-weight: 650; }
h3 { font-size: var(--step-1); font-weight: 600; }
h4 { font-size: var(--step-0); font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--font-mono); }
:not(pre) > code {
  font-size: 0.88em;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.05em 0.35em;
  white-space: nowrap;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 16px; top: -60px; z-index: 100;
  background: var(--accent); color: var(--accent-ink);
  padding: 8px 14px; border-radius: var(--radius); font-weight: 700;
}
.skip-link:focus { top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- 3. Buttons ---------- */
.btn {
  font: inherit; font-size: var(--step--1); font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 6px 14px;
  border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 3px 10px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- 4. App shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px;
  padding-inline: 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark {
  font-family: var(--font-mono); font-weight: 600; font-size: 15px;
  background: var(--accent); color: var(--accent-ink);
  border-radius: 6px; padding: 4px 7px; line-height: 1;
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.menu-toggle { display: none; }
.progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.progress-label { font-size: var(--step--1); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress-track { width: 180px; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.progress-fill { height: 100%; width: 0; background: var(--good); transition: width 0.3s; }

.layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); align-items: start; }

.sidebar {
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 14px 10px 40px;
}
.nav-group-title {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); padding: 14px 10px 6px;
}
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link {
  display: grid; grid-template-columns: 30px 1fr 18px; align-items: center; gap: 6px;
  padding: 7px 10px; border-radius: 6px;
  color: var(--ink); text-decoration: none; font-size: 0.94rem; line-height: 1.3;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-num { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-link[aria-current="page"] .nav-num { color: var(--accent); }
.nav-tick {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--line); display: grid; place-items: center;
  font-size: 11px; color: transparent;
}
.nav-tick.done { background: var(--good); border-color: var(--good); color: var(--surface); }
.sidebar-foot { padding: 18px 10px 0; display: grid; gap: 8px; }

.main { padding: 28px 40px 80px; min-width: 0; }
.page { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }
.main:focus { outline: none; }

@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-toggle { display: inline-flex; }
  .sidebar {
    position: fixed; z-index: 60; left: 0;
    top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    width: min(320px, 86vw); height: calc(100% - var(--topbar-h));
    transform: translateX(-102%); transition: transform 0.2s;
    box-shadow: 4px 0 24px rgba(0,0,0,0.18);
  }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(0,0,0,0.35); z-index: 55; }
  .main { padding: 22px 16px 70px; }
}
@media (max-width: 640px) {
  .progress-track { width: 70px; }
  .brand-name { display: none; }
  h1 { font-size: 1.7rem; }
  #themeToggle .label { display: none; }
}

/* ---------- 5. Page header and topic map ---------- */
.page-head { display: grid; gap: 10px; }
.eyebrow {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent);
}
.lede { font-size: 1.08rem; color: var(--muted); max-width: 68ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }

.topic-map { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.topic-map a {
  display: inline-block; font-size: 0.8rem; text-decoration: none;
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  color: var(--muted); background: var(--surface);
}
.topic-map a:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- 6. Lesson parts ---------- */
.part {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; display: grid; gap: 16px; box-shadow: var(--shadow); min-width: 0;
}
.part-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.part-step { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.part-tag {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted);
}
.part[data-kind="explain"] .part-tag, .part[data-kind="intro"] .part-tag { background: var(--accent-soft); color: var(--accent); }
.part[data-kind="example"] .part-tag { background: var(--code-bg); color: var(--code-fg); }
.part[data-kind="demo"] .part-tag { background: var(--accent-soft); color: var(--accent); }
.part[data-kind="activity"] .part-tag { background: var(--good-soft); color: var(--good); }
.part[data-kind="challenge"] .part-tag { background: var(--warn-soft); color: var(--warn); }
.part[data-kind="mistakes"] .part-tag { background: var(--bad-soft); color: var(--bad); }
.part[data-kind="check"] .part-tag { background: var(--violet-soft); color: var(--violet); }
.part[data-kind="keypoints"] .part-tag { background: var(--teal-soft); color: var(--teal); }
.part[data-kind="keypoints"] { background: var(--teal-soft); border-color: transparent; }

.prose { display: grid; gap: 12px; max-width: 72ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.stack { display: grid; gap: 16px; min-width: 0; }
.objectives { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.objectives li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.objectives li::before {
  content: "✓"; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); margin-top: 2px;
}
.keypoints { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.mini-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; background: var(--surface); }
.mini-card h4 { font-size: 0.98rem; }
.mini-card p { font-size: 0.92rem; color: var(--muted); }

.callout {
  border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 4px;
  background: var(--accent-soft); color: var(--ink); max-width: 72ch;
}
.callout strong:first-child { color: var(--accent); }
.callout.warn { background: var(--warn-soft); }
.callout.warn strong:first-child { color: var(--warn); }
.callout.bad { background: var(--bad-soft); }
.callout.bad strong:first-child { color: var(--bad); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* Details / expandable sections */
details.expander { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.expander > summary {
  cursor: pointer; padding: 10px 14px; font-weight: 700; list-style: none;
  display: flex; align-items: center; gap: 8px;
}
details.expander > summary::-webkit-details-marker { display: none; }
details.expander > summary::before { content: "▸"; color: var(--accent); transition: transform 0.15s; }
details.expander[open] > summary::before { transform: rotate(90deg); }
details.expander > .expander-body { padding: 0 14px 14px; display: grid; gap: 10px; }
details.hint > summary { color: var(--warn); }
details.hint > summary::before { color: var(--warn); }

/* Tabs */
.tabs { display: grid; gap: 0; min-width: 0; }
.tablist { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-size: 0.92rem; font-weight: 700; cursor: pointer;
  background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
  padding: 8px 12px; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabpanel { padding-top: 16px; display: grid; gap: 12px; min-width: 0; }

/* ---------- 7. Code blocks ---------- */
.code {
  background: var(--code-bg); color: var(--code-fg);
  border-radius: var(--radius); overflow: hidden; min-width: 0;
  border: 1px solid var(--code-bar);
}
.code-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--code-bar); padding: 6px 10px 6px 14px;
  font-family: var(--font-mono); font-size: 0.75rem; color: var(--code-gutter);
}
.code-bar .btn {
  min-height: 28px; padding: 2px 9px; font-size: 0.75rem;
  background: transparent; color: var(--code-fg); border-color: #3a465a;
}
.code-bar .btn:hover { border-color: var(--tk-type); }
.code pre { margin: 0; padding: 12px 0; overflow-x: auto; font-size: 0.86rem; line-height: 1.65; tab-size: 4; }
.code .line { display: grid; grid-template-columns: 3.2em 1fr; padding-right: 16px; min-width: max-content; }
.code .gutter { text-align: right; padding-right: 1em; color: var(--code-gutter); user-select: none; font-variant-numeric: tabular-nums; }
.code .src { white-space: pre; }
.code .line.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--tk-type); }
.code .line.dim { opacity: 0.45; }
.code .line.clickable { cursor: pointer; }
.code .line.clickable:hover { background: rgba(255,255,255,0.05); }
.code .line.picked-good { background: rgba(95, 211, 148, 0.18); box-shadow: inset 3px 0 0 #5fd394; }
.code .line.picked-bad { background: rgba(255, 139, 128, 0.16); box-shadow: inset 3px 0 0 #ff8b80; }
@media (max-width: 640px) { .code pre { font-size: 0.8rem; } }

.tk-kw { color: var(--tk-kw); }
.tk-type { color: var(--tk-type); }
.tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); }
.tk-com { color: var(--tk-com); font-style: italic; }
.tk-pre { color: var(--tk-pre); }
.tk-fn { color: var(--tk-fn); }
.tk-ns { color: var(--tk-ns); }

.console {
  background: var(--code-bg); color: #cfe9d3; border-radius: var(--radius);
  font-family: var(--font-mono); font-size: 0.85rem; padding: 12px 14px;
  white-space: pre-wrap; overflow-wrap: anywhere; min-height: 3em; border: 1px solid var(--code-bar);
}
.console .in { color: var(--tk-fn); }
.console .note { color: var(--tk-com); }
.console .err { color: #ff9b91; }
.console-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Line-by-line explanation */
.walk { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.walk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.walk-item {
  width: 100%; text-align: left; font: inherit; font-size: 0.93rem; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px;
}
.walk-item:hover { border-color: var(--accent); }
.walk-item[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.walk-ln { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--accent); white-space: nowrap; padding-top: 2px; }
@media (max-width: 860px) { .walk { grid-template-columns: minmax(0, 1fr); } .walk .code { position: static; } }
@media (min-width: 861px) { .walk .code { position: sticky; top: calc(var(--topbar-h) + 16px); } }

/* ---------- 8. Activities ---------- */
.activity { display: grid; gap: 12px; padding: 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.activity-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.activity-kind {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; background: var(--surface);
}
.level { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.level.beginner { background: var(--good-soft); color: var(--good); }
.level.developing { background: var(--accent-soft); color: var(--accent); }
.level.intermediate { background: var(--warn-soft); color: var(--warn); }
.level.advanced { background: var(--bad-soft); color: var(--bad); }

.options { display: grid; gap: 8px; }
.option {
  font: inherit; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: var(--radius); padding: 9px 12px;
}
.option:hover { border-color: var(--accent); }
.option .letter {
  width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  font-size: 0.8rem; font-weight: 700; background: var(--surface-2); color: var(--muted);
}
.option.mono .text { font-family: var(--font-mono); font-size: 0.9rem; white-space: pre-wrap; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .letter { background: var(--good); color: var(--surface); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .letter { background: var(--bad); color: var(--surface); }
.option.selected { border-color: var(--accent); background: var(--accent-soft); }

.feedback { border-radius: var(--radius); padding: 10px 14px; font-size: 0.95rem; display: grid; gap: 4px; }
.feedback:empty { display: none; }
.feedback.good { background: var(--good-soft); }
.feedback.good strong:first-child { color: var(--good); }
.feedback.bad { background: var(--bad-soft); }
.feedback.bad strong:first-child { color: var(--bad); }
.feedback.info { background: var(--accent-soft); }

/* Fill-in-the-code inputs */
.fill-input {
  font-family: var(--font-mono); font-size: 0.86rem; color: var(--code-fg);
  background: #2a3447; border: 1px solid #4a5870; border-radius: 4px;
  padding: 0 4px; margin: 0 1px; min-width: 3ch;
}
.fill-input:focus { outline: 2px solid var(--tk-type); outline-offset: 1px; }
.fill-input.ok { border-color: #5fd394; background: rgba(95, 211, 148, 0.18); }
.fill-input.no { border-color: #ff8b80; background: rgba(255, 139, 128, 0.18); }

/* Code ordering */
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: 6px 8px 6px 12px;
  border: 1.5px solid var(--code-bar);
}
.order-item .pos { font-family: var(--font-mono); font-size: 0.75rem; color: var(--code-gutter); font-variant-numeric: tabular-nums; }
.order-item .src { font-family: var(--font-mono); font-size: 0.85rem; white-space: pre; overflow-x: auto; }
.order-item .moves { display: flex; gap: 4px; }
.order-item .moves button {
  font: inherit; font-size: 0.85rem; width: 32px; height: 32px; cursor: pointer;
  border-radius: 6px; border: 1px solid #3a465a; background: transparent; color: var(--code-fg);
}
.order-item .moves button:hover { border-color: var(--tk-type); }
.order-item.ok { border-color: #5fd394; }
.order-item.no { border-color: #ff8b80; }

/* Match / select rows */
.match-rows { display: grid; gap: 8px; }
.match-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 220px) 28px; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px;
}
.match-row .val { font-family: var(--font-mono); font-size: 0.9rem; overflow-wrap: anywhere; }
.match-row .mark { font-weight: 700; text-align: center; }
.match-row.ok { border-color: var(--good); }
.match-row.ok .mark { color: var(--good); }
.match-row.no { border-color: var(--bad); }
.match-row.no .mark { color: var(--bad); }
.match-row .why { grid-column: 1 / -1; font-size: 0.88rem; color: var(--muted); }
select, input[type="text"], input[type="number"], textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 38px; max-width: 100%;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
label { font-weight: 700; font-size: 0.9rem; }
@media (max-width: 560px) { .match-row { grid-template-columns: minmax(0, 1fr) 28px; } .match-row select { grid-column: 1 / 2; grid-row: 2; } }

/* Task / challenge */
.task-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.task-steps label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 0.95rem; cursor: pointer; }
.task-steps input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--good); flex-shrink: 0; }
.scratch {
  width: 100%; min-height: 150px; resize: vertical;
  font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6;
  background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--code-bar); tab-size: 4;
}
.field { display: grid; gap: 4px; }
.field-hint { font-size: 0.82rem; color: var(--muted); font-weight: 400; }

/* Common mistakes */
.mistake { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--surface); }
.mistake-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.mistake-pair .lbl { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.mistake-pair .lbl.no { color: var(--bad); }
.mistake-pair .lbl.yes { color: var(--good); }
.mistake-pair > div { display: grid; gap: 4px; min-width: 0; }
@media (max-width: 700px) { .mistake-pair { grid-template-columns: minmax(0, 1fr); } }

/* Page footer nav */
.page-foot {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--line); padding-top: 22px;
}
.complete-btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }

/* ---------- 9. Visual widgets ---------- */
.viz { display: grid; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; }
.viz-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.viz-status { font-size: 0.95rem; padding: 10px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } }

/* Pipeline */
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.pipe-stage {
  font: inherit; cursor: pointer; flex: 1 1 120px; text-align: left;
  border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink);
  padding: 10px 12px; display: grid; gap: 2px;
}
.pipe-stage small { font-family: var(--font-mono); color: var(--muted); font-size: 0.75rem; }
.pipe-stage[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pipe-arrow { align-self: center; color: var(--muted); font-weight: 700; }
@media (max-width: 640px) { .pipe-arrow { display: none; } }

/* Variable boxes / memory */
.var-box { display: inline-grid; grid-template-rows: auto auto auto; border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; min-width: 140px; background: var(--surface); }
.var-box .t { background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 0.8rem; padding: 3px 10px; }
.var-box .n { font-family: var(--font-mono); font-weight: 600; padding: 4px 10px 0; }
.var-box .v { font-family: var(--font-mono); font-size: 1.2rem; padding: 2px 10px 8px; }

.memory { display: grid; gap: 4px; }
.mem-row {
  display: grid; grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: center;
  border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--surface);
  font-family: var(--font-mono); font-size: 0.86rem;
}
.mem-row .addr { color: var(--muted); font-variant-numeric: tabular-nums; }
.mem-row .name { font-weight: 600; }
.mem-row .alias { color: var(--violet); font-size: 0.8rem; }
.mem-row.active { border-color: var(--accent); background: var(--accent-soft); }
.mem-row.target { border-color: var(--good); background: var(--good-soft); }
.mem-row.empty { opacity: 0.45; }
.mem-head { font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; padding: 0 12px; }
.ptr-arrow { color: var(--good); font-weight: 700; }
@media (max-width: 560px) { .mem-row { grid-template-columns: 90px minmax(0, 1fr); } .mem-row .val { grid-column: 1 / -1; } }

/* Array cells */
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell {
  font: inherit; cursor: pointer; display: grid; min-width: 62px;
  border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); color: var(--ink); padding: 0;
}
.cell .cv { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; padding: 10px 8px; text-align: center; }
.cell .ci { font-family: var(--font-mono); font-size: 0.75rem; background: var(--surface-2); color: var(--muted); padding: 3px; text-align: center; }
.cell.active { border-color: var(--accent); }
.cell.active .ci { background: var(--accent); color: var(--accent-ink); }
.cell.visited { border-color: var(--good); }
.cell.ghost { border-style: dashed; opacity: 0.7; cursor: default; }
.cell.ghost .cv { color: var(--bad); }

/* Trace stepper and loop visualiser */
.trace-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .trace-grid { grid-template-columns: minmax(0, 1fr); } }
.state-table { width: 100%; }
.state-table td:first-child { font-family: var(--font-mono); font-weight: 600; }
.state-table td:last-child { font-family: var(--font-mono); }
.state-table tr.changed td { background: var(--warn-soft); }
.cond { font-family: var(--font-mono); font-size: 0.9rem; padding: 10px 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow-x: auto; }
.cond .t { color: var(--good); font-weight: 700; }
.cond .f { color: var(--bad); font-weight: 700; }
.step-count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Flow diagram (SVG) */
.flow-svg { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; }
.flow-svg .node rect, .flow-svg .node polygon { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.flow-svg .node text { fill: var(--ink); font-family: var(--font-mono); font-size: 13px; }
.flow-svg .node.on rect, .flow-svg .node.on polygon { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.flow-svg .node.result.on rect { fill: var(--good-soft); stroke: var(--good); }
.flow-svg .edge { stroke: var(--line); stroke-width: 2; fill: none; }
.flow-svg .edge.on { stroke: var(--accent); stroke-width: 3; }
.flow-svg .elabel { fill: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 700; }
.flow-svg .elabel.on { fill: var(--accent); }
.flow-svg .arrowhead { fill: var(--line); }
.flow-svg .arrowhead.on { fill: var(--accent); }

/* Function flow */
.frames { display: grid; grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1fr); gap: 8px; align-items: center; }
.frame { border: 2px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: grid; gap: 8px; min-width: 0; }
.frame.on { border-color: var(--accent); }
.frame h4 { font-family: var(--font-mono); font-size: 0.88rem; }
.slot { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 0.88rem; padding: 6px 10px; border-radius: 6px; background: var(--surface-2); }
.slot.on { background: var(--warn-soft); outline: 2px solid var(--warn); }
.flow-mid { text-align: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); display: grid; gap: 4px; }
.flow-mid .arrow { font-size: 1.4rem; color: var(--accent); }
@media (max-width: 640px) { .frames { grid-template-columns: minmax(0, 1fr); } .flow-mid .arrow { transform: rotate(90deg); } }

/* Class / object diagram */
.uml { border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; background: var(--surface); font-family: var(--font-mono); font-size: 0.84rem; min-width: 0; }
.uml > div { padding: 6px 12px; border-top: 1px solid var(--line); }
.uml .uml-name { background: var(--accent); color: var(--accent-ink); font-weight: 600; text-align: center; border: 0; }
.uml .uml-sub { font-family: var(--font-body); font-size: 0.7rem; font-weight: 400; display: block; opacity: 0.85; }
.uml .member { display: block; }
.uml .inherited { color: var(--muted); }
.uml .tagp { font-family: var(--font-body); font-size: 0.68rem; font-weight: 700; padding: 0 5px; border-radius: 3px; margin-left: 4px; }
.uml .tag-pub { background: var(--good-soft); color: var(--good); }
.uml .tag-pro { background: var(--warn-soft); color: var(--warn); }
.uml .tag-pri { background: var(--bad-soft); color: var(--bad); }
.uml.obj { border-color: var(--good); border-style: dashed; }
.uml.obj .uml-name { background: var(--good); color: var(--surface); }
.objects { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.obj-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); }

/* Hierarchy tree */
.tree { display: grid; justify-items: center; gap: 0; }
.tree-node {
  font: inherit; font-family: var(--font-mono); font-weight: 600; cursor: pointer;
  padding: 10px 18px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.tree-node[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tree-kids { display: flex; gap: 40px; justify-content: center; position: relative; padding-top: 28px; flex-wrap: wrap; }
.tree-stem { width: 2px; height: 22px; background: var(--muted); }
.tree-kids::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; background: var(--muted); }
.tree-kid { display: grid; justify-items: center; position: relative; }
.tree-kid::before { content: "▲"; position: absolute; top: -24px; color: var(--muted); font-size: 12px; line-height: 1; }
.tree-caption { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

/* Class designer */
.designer-rows { display: grid; gap: 6px; }
.designer-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 6px; align-items: center; }
.designer-row button { width: 36px; height: 36px; }
@media (max-width: 560px) { .designer-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; } .designer-row select:first-child { grid-column: 1 / -1; } }

/* File system sim */
.file-pane { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.file-pane .fp-head { background: var(--surface-2); padding: 6px 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.file-pane pre { margin: 0; padding: 12px; font-size: 0.85rem; min-height: 6em; white-space: pre-wrap; }

/* String lab */
.char-cells .cell { min-width: 42px; }
.char-cells .cell .cv { font-size: 1rem; padding: 8px 4px; }
.char-cells .cell.in-range { border-color: var(--violet); }

/* ---------- 10. Playground ---------- */
.sim-banner {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
  background: var(--warn-soft); border-radius: var(--radius); padding: 12px 16px;
}
.sim-badge { font-family: var(--font-mono); font-weight: 600; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: var(--warn); color: var(--surface); }
.ide { border-radius: 10px; overflow: hidden; border: 1px solid var(--code-bar); background: var(--code-bg); min-width: 0; }
.ide-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--code-bar); }
.ide-tab { font-family: var(--font-mono); font-size: 0.8rem; color: var(--code-fg); padding: 4px 10px; border-radius: 6px 6px 0 0; background: var(--code-bg); }
.ide-bar .btn { min-height: 32px; font-size: 0.8rem; }
.ide-bar .btn:not(.primary) { background: transparent; color: var(--code-fg); border-color: #3a465a; }
.ide-bar .btn.run { background: #2f9e62; border-color: #2f9e62; color: #fff; }
.editor { position: relative; display: grid; grid-template-columns: 3.2em minmax(0, 1fr); max-height: 460px; overflow: auto; }
.editor-gutter {
  font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.65; padding: 12px 1em 12px 0;
  text-align: right; color: var(--code-gutter); user-select: none; white-space: pre; font-variant-numeric: tabular-nums;
  position: sticky; left: 0; z-index: 1; background: var(--code-bg);
}
/* The text area grows to the code's width so the overlay and highlighting stay aligned while scrolling. */
.editor-area { position: relative; width: max-content; min-width: 100%; }
.editor-area pre, .editor-area textarea {
  margin: 0; padding: 12px 16px 12px 0; border: 0;
  font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.65; tab-size: 4;
  white-space: pre; overflow: hidden; min-height: 100%;
}
.editor-area pre { pointer-events: none; color: var(--code-fg); }
.editor-area textarea {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none;
  background: transparent; color: transparent; caret-color: #fff; outline: none; border-radius: 0;
}
.editor-area textarea::selection { background: rgba(111, 176, 255, 0.35); color: transparent; }
.ide-foot { display: grid; gap: 8px; padding: 10px; background: var(--code-bar); }
.ide-foot label { color: var(--code-fg); font-size: 0.8rem; }
.ide-foot input { background: var(--code-bg); color: var(--code-fg); border-color: #3a465a; font-family: var(--font-mono); font-size: 0.85rem; }
.ide-status { font-family: var(--font-mono); font-size: 0.75rem; color: var(--code-gutter); }
.playground-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
.example-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.example-list button {
  width: 100%; text-align: left; font: inherit; font-size: 0.9rem; cursor: pointer; padding: 7px 10px;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink);
}
.example-list button:hover { background: var(--surface-2); }
.example-list button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
@media (max-width: 860px) {
  .playground-layout { grid-template-columns: minmax(0, 1fr); }
  .example-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}

/* ---------- 11. Quiz results / welcome ---------- */
.score-big { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.topic-bars { display: grid; gap: 8px; }
.topic-bar { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 0.9rem; }
.topic-bar .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.topic-bar .fill { height: 100%; background: var(--good); }
.topic-bar.weak .fill { background: var(--bad); }
.topic-bar .pct { font-variant-numeric: tabular-nums; text-align: right; }
.quiz-q { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.quiz-q .qtopic { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.route { display: grid; gap: 10px; counter-reset: route; }
.route-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.route-row:first-child { border-top: 0; }
.route-row h3 { font-size: 1rem; }
.route-links { display: flex; flex-wrap: wrap; gap: 6px; }
.route-links a { font-size: 0.88rem; text-decoration: none; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.route-links a:hover { border-color: var(--accent); color: var(--accent); }
.route-links a.done { border-color: var(--good); color: var(--good); }
@media (max-width: 600px) { .route-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

.legend { display: flex; flex-wrap: wrap; gap: 8px; }

</style>

      </div>

    <div class="scrim" id="scrim" hidden></div>

    <!-- Lesson content is rendered here by js/app.js -->
    <main class="main" id="main" tabindex="-1">
      <noscript><p>This course needs JavaScript for its interactive activities. Please enable it and reload the page.</p></noscript>
    </main>
  </div>

  <!-- Single-file build: all CSS and JavaScript are inlined below, in dependency order. -->
  <script>
/* ==========================================================================
   core.js — shared helpers, saved progress, C++ syntax highlighter and the
   reusable learning components (questions, fill-in, ordering, debugging,
   tasks, tabs, code walkthroughs). Content files describe blocks as plain
   objects; renderBlock() turns each one into interactive DOM.
   ========================================================================== */
'use strict';

/* ---------- 1. Small helpers ---------- */

/** Escape text for safe insertion into HTML. */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Remove the common indentation from a multi-line string. */
function dedent(s) {
  s = s.replace(/^\n/, '').replace(/\s+$/, '');
  const lines = s.split('\n');
  const indents = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
  const min = indents.length ? Math.min(...indents) : 0;
  return lines.map(l => l.slice(min)).join('\n');
}

/**
 * Template tag for C++ snippets: keeps backslashes (so "\n" stays as typed)
 * and strips indentation, so code can be indented neatly in content files.
 */
function cpp(strings, ...vals) {
  return dedent(String.raw({ raw: strings.raw }, ...vals));
}

let uidCounter = 0;
function uid(prefix = 'u') { return prefix + '-' + (++uidCounter); }

/** Create an element with attributes and optional inner HTML. */
function el(tag, attrs = {}, html = '') {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    node.setAttribute(k, v === true ? '' : v);
  }
  if (html) node.innerHTML = html;
  return node;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Parse "3", "3-5" or [1, 4] into an array of line numbers. */
function parseLines(spec) {
  if (Array.isArray(spec)) return spec.flatMap(parseLines);
  const s = String(spec);
  if (s.includes('-')) {
    const [a, b] = s.split('-').map(Number);
    return Array.from({ length: b - a + 1 }, (_, i) => a + i);
  }
  return [Number(s)];
}

/* ---------- 2. Saved progress (localStorage, fails safely) ---------- */
const Store = {
  key: 'cppFoundations.v1',
  data: null,
  fresh() { return { done: {}, scratch: {}, steps: {}, checks: {}, last: null, quiz: null }; },
  load() {
    this.data = this.fresh();
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) { /* storage blocked: run without saving */ }
  },
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
  },
  reset() { this.data = this.fresh(); this.save(); }
};

/* ---------- 3. C++ syntax highlighter ---------- */
const CPP_KEYWORDS = new Set(('alignas auto break case catch class const constexpr continue default delete do else enum ' +
  'explicit false final for friend if inline namespace new nullptr operator override private protected public ' +
  'return sizeof static struct switch template this throw true try typedef typename using virtual void while').split(' '));
const CPP_TYPES = new Set(('int float double char bool long short unsigned signed size_t string vector ' +
  'ifstream ofstream fstream ostream istream endl').split(' '));

/** Highlight one line of C++ and return HTML. */
function hlLine(line) {
  if (/^\s*#/.test(line)) {
    return '<span class="tk-pre">' + esc(line).replace(/(&lt;[^&]*&gt;|&quot;[^&]*&quot;)/g, '<span class="tk-str">$1</span>') + '</span>';
  }
  const re = /(\/\/.*$)|("(?:\\.|[^"\\])*"?)|('(?:\\.|[^'\\])*'?)|(\b\d+(?:\.\d+)?f?\b)|([A-Za-z_]\w*)|(\s+)|([\s\S])/g;
  let out = '';
  let m;
  while ((m = re.exec(line)) !== null) {
    const [tok, com, str, chr, num, id] = m;
    if (com) out += `<span class="tk-com">${esc(tok)}</span>`;
    else if (str || chr) out += `<span class="tk-str">${esc(tok)}</span>`;
    else if (num) out += `<span class="tk-num">${esc(tok)}</span>`;
    else if (id) {
      const rest = line.slice(re.lastIndex);
      if (CPP_KEYWORDS.has(id)) out += `<span class="tk-kw">${id}</span>`;
      else if (CPP_TYPES.has(id)) out += `<span class="tk-type">${id}</span>`;
      else if (id === 'std' && rest.startsWith('::')) out += `<span class="tk-ns">${id}</span>`;
      else if (/^[A-Z]/.test(id)) out += `<span class="tk-type">${id}</span>`;
      else if (/^\s*\(/.test(rest)) out += `<span class="tk-fn">${id}</span>`;
      else out += esc(id);
    } else out += esc(tok);
  }
  return out;
}

/* Code registry so copy / playground buttons can find the raw source. */
const CodeRegistry = new Map();

/**
 * Render a code block as an HTML string.
 * opts: file, highlight (line numbers), clickable (debug mode), playground (example id)
 */
function codeBlock(src, opts = {}) {
  const id = uid('code');
  CodeRegistry.set(id, src);
  const hl = new Set(opts.highlight ? parseLines(opts.highlight) : []);
  const lines = src.split('\n').map((l, i) => {
    const n = i + 1;
    const cls = ['line'];
    if (hl.has(n)) cls.push('hl');
    const extra = opts.clickable
      ? ` role="button" tabindex="0" aria-label="Line ${n}: ${esc(l.trim() || 'blank line')}"` : '';
    if (opts.clickable) cls.push('clickable');
    return `<span class="${cls.join(' ')}" data-n="${n}"${extra}><span class="gutter" aria-hidden="true">${n}</span><span class="src">${hlLine(l) || ' '}</span></span>`;
  }).join('');
  const play = opts.playground
    ? `<a class="btn" href="#playground" data-open-example="${esc(opts.playground)}">Open in playground</a>` : '';
  return `<div class="code" data-code-id="${id}">
    <div class="code-bar"><span>${esc(opts.file || 'main.cpp')}</span>
      <span class="btn-row">${play}<button type="button" class="btn" data-copy="${id}">Copy</button></span></div>
    <pre tabindex="0" aria-label="C++ code, ${esc(opts.file || 'main.cpp')}"><code>${lines}</code></pre></div>`;
}

/** Highlight specific lines inside a rendered code block. */
function setCodeHighlight(container, lines) {
  const set = new Set(lines);
  container.querySelectorAll('.line').forEach(l => l.classList.toggle('hl', set.has(Number(l.dataset.n))));
  const first = container.querySelector('.line.hl');
  if (first) {
    const pre = first.closest('pre');
    const top = first.offsetTop - pre.clientHeight / 2;
    if (first.offsetTop < pre.scrollTop || first.offsetTop > pre.scrollTop + pre.clientHeight - 30) pre.scrollTop = Math.max(0, top);
  }
}

/** Global click handler for Copy buttons inside code bars. */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const src = CodeRegistry.get(btn.dataset.copy) || '';
  const done = ok => { btn.textContent = ok ? 'Copied' : 'Select and copy'; setTimeout(() => (btn.textContent = 'Copy'), 1600); };
  try {
    navigator.clipboard.writeText(src).then(() => done(true), () => fallbackSelect(btn, done));
  } catch (err) { fallbackSelect(btn, done); }
});
function fallbackSelect(btn, done) {
  const pre = btn.closest('.code').querySelector('pre');
  const range = document.createRange();
  range.selectNodeContents(pre);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  done(false);
}

/* ---------- 4. Block renderer ---------- */

/**
 * Render any content block. ctx carries the page id and a counter so that
 * saved state (task checklists, scratchpads) has a stable key.
 */
function renderBlock(block, ctx) {
  if (typeof block === 'string') block = { type: 'html', html: block };
  const fn = BlockTypes[block.type];
  if (!fn) { console.warn('Unknown block type', block.type); return el('div'); }
  ctx.n = (ctx.n || 0) + 1;
  return fn(block, ctx);
}
function renderBlocks(blocks, ctx) {
  const frag = document.createDocumentFragment();
  (blocks || []).forEach(b => frag.appendChild(renderBlock(b, ctx)));
  return frag;
}

const BlockTypes = {
  /* Plain prose */
  html(b) { return el('div', { class: 'prose' }, b.html); },

  /* Highlighted info, warning or error panel */
  callout(b) {
    return el('div', { class: 'callout ' + (b.tone || '') }, `<strong>${b.title}</strong><div>${b.html}</div>`);
  },

  /* Grid of small cards: items = [[title, text], ...] */
  cards(b) {
    return el('div', { class: 'card-grid' }, b.items.map(([t, d]) => `<div class="mini-card"><h4>${t}</h4><p>${d}</p></div>`).join(''));
  },

  /* Table: head = [..], rows = [[..], ..] */
  table(b) {
    const head = `<thead><tr>${b.head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead>`;
    const body = `<tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
    const wrap = el('div', { class: 'table-wrap', tabindex: '0', role: 'region', 'aria-label': b.caption || 'Table' });
    wrap.innerHTML = `<table>${b.caption ? `<caption class="sr-only">${b.caption}</caption>` : ''}${head}${body}</table>`;
    return wrap;
  },

  /* Stand-alone code example with optional output */
  code(b) {
    const wrap = el('div', { class: 'stack' });
    if (b.caption) wrap.appendChild(el('p', {}, b.caption));
    wrap.insertAdjacentHTML('beforeend', codeBlock(b.code, { file: b.file, highlight: b.highlight, playground: b.playground }));
    if (b.output != null) {
      wrap.insertAdjacentHTML('beforeend', `<div class="console-label">Output</div><div class="console">${esc(b.output)}</div>`);
    }
    return wrap;
  },

  /* Expandable section */
  details(b, ctx) {
    const d = el('details', { class: 'expander' + (b.hint ? ' hint' : '') });
    d.innerHTML = `<summary>${b.summary}</summary>`;
    const body = el('div', { class: 'expander-body' });
    if (b.html) body.appendChild(el('div', { class: 'prose' }, b.html));
    if (b.blocks) body.appendChild(renderBlocks(b.blocks, ctx));
    d.appendChild(body);
    return d;
  },

  /* Accessible tabs: tabs = [{label, html?, blocks?}] */
  tabs(b, ctx) {
    const id = uid('tabs');
    const wrap = el('div', { class: 'tabs' });
    const list = el('div', { class: 'tablist', role: 'tablist', 'aria-label': b.label || 'Topics' });
    wrap.appendChild(list);
    const tabs = [], panels = [];
    b.tabs.forEach((t, i) => {
      const tab = el('button', {
        class: 'tab', role: 'tab', type: 'button', id: `${id}-t${i}`,
        'aria-controls': `${id}-p${i}`, 'aria-selected': i === 0 ? 'true' : 'false', tabindex: i === 0 ? '0' : '-1'
      }, t.label);
      const panel = el('div', { class: 'tabpanel', role: 'tabpanel', id: `${id}-p${i}`, 'aria-labelledby': `${id}-t${i}`, tabindex: '0' });
      if (i !== 0) panel.hidden = true;
      if (t.html) panel.appendChild(el('div', { class: 'prose' }, t.html));
      if (t.blocks) panel.appendChild(renderBlocks(t.blocks, ctx));
      list.appendChild(tab); wrap.appendChild(panel);
      tabs.push(tab); panels.push(panel);
    });
    const select = i => {
      tabs.forEach((t, j) => { t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; panels[j].hidden = j !== i; });
      tabs[i].focus();
    };
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => select(i));
      t.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') { e.preventDefault(); select((i + 1) % tabs.length); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); select((i - 1 + tabs.length) % tabs.length); }
        if (e.key === 'Home') { e.preventDefault(); select(0); }
        if (e.key === 'End') { e.preventDefault(); select(tabs.length - 1); }
      });
    });
    return wrap;
  },

  /* Reveal-answer button */
  reveal(b) {
    const wrap = el('div', { class: 'activity' });
    const bodyId = uid('rev');
    wrap.innerHTML = `${b.q ? `<p><strong>${b.q}</strong></p>` : ''}
      <div class="btn-row"><button type="button" class="btn" aria-expanded="false" aria-controls="${bodyId}">${b.label || 'Reveal answer'}</button></div>
      <div id="${bodyId}" class="feedback info" hidden>${b.html}</div>`;
    const btn = wrap.querySelector('button'), body = wrap.querySelector('#' + bodyId);
    btn.addEventListener('click', () => {
      body.hidden = !body.hidden;
      btn.setAttribute('aria-expanded', !body.hidden);
      btn.textContent = body.hidden ? (b.label || 'Reveal answer') : 'Hide answer';
    });
    return wrap;
  },

  /* Multiple choice. options: string or [text, whyWrong]. */
  mcq(b, ctx) { return choiceQuestion(b, ctx, false); },
  /* Predict the output: same as mcq with monospace options. */
  predict(b, ctx) { return choiceQuestion(b, ctx, true); },

  fill: fillBlock,
  order: orderBlock,
  debug: debugBlock,
  task: taskBlock,
  match: matchBlock,

  /* Interactive visual widget from widgets.js */
  widget(b, ctx) {
    const wrap = el('div', { class: 'viz' });
    if (b.title) wrap.appendChild(el('h3', {}, b.title));
    if (b.intro) wrap.appendChild(el('p', {}, b.intro));
    const host = el('div', { class: 'stack' });
    wrap.appendChild(host);
    if (typeof Widgets !== 'undefined' && Widgets[b.name]) Widgets[b.name](host, b.opts || {}, ctx);
    else host.textContent = 'Widget not found: ' + b.name;
    return wrap;
  }
};

/* ---------- 5. Multiple choice / predict ---------- */
function choiceQuestion(b, ctx, mono) {
  const box = el('div', { class: 'activity' });
  const qid = uid('q');
  const kind = b.kind || (mono ? 'Predict the output' : 'Multiple choice');
  const opts = b.options.map(o => (Array.isArray(o) ? o : [o, '']));
  box.innerHTML = `
    <div class="activity-title"><span class="activity-kind">${kind}</span></div>
    <p id="${qid}"><strong>${b.q}</strong></p>
    ${b.code ? codeBlock(b.code, { file: b.file }) : ''}
    <div class="options" role="group" aria-labelledby="${qid}">
      ${opts.map(([t], i) => `<button type="button" class="option${mono ? ' mono' : ''}" data-i="${i}">
        <span class="letter" aria-hidden="true">${'ABCDEF'[i]}</span><span class="text">${mono ? esc(t) : t}</span></button>`).join('')}
    </div>
    <div class="feedback" role="status" aria-live="polite"></div>`;
  const fb = box.querySelector('.feedback');
  let firstTry = null, solved = false;
  box.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (solved) return;
      const i = Number(btn.dataset.i);
      const ok = i === b.answer;
      if (firstTry === null) { firstTry = ok; if (b.onResult) b.onResult(ok); if (ctx && ctx.onCheck) ctx.onCheck(box, ok); }
      if (ok) {
        solved = true;
        btn.classList.add('correct');
        btn.setAttribute('aria-label', 'Correct answer: ' + btn.textContent.trim());
        fb.className = 'feedback good';
        fb.innerHTML = `<strong>Correct.</strong> <span>${b.explain || ''}</span>`;
      } else {
        btn.classList.add('wrong');
        btn.setAttribute('aria-label', 'Incorrect: ' + btn.textContent.trim());
        fb.className = 'feedback bad';
        fb.innerHTML = `<strong>Not quite.</strong> <span>${opts[i][1] || 'Look again at the explanation above and try another option.'} Try again.</span>`;
      }
    });
  });
  return box;
}

/* ---------- 6. Fill in the code ---------- */
/* template uses [[answer]] or [[answer|alternative]] for each blank. */
function fillBlock(b) {
  const box = el('div', { class: 'activity' });
  const answers = [];
  const lines = b.template.split('\n').map((line, li) => {
    // Answers cannot contain brackets, so "a[[[i]]]" means a[ + blank(i) + ].
    const parts = line.split(/\[\[([^\[\]]+?)\]\]/);
    let html = '';
    parts.forEach((p, i) => {
      if (i % 2 === 0) html += hlLine(p);
      else {
        const alts = p.split('|');
        const n = answers.push(alts);
        const w = Math.max(...alts.map(a => a.length)) + 2;
        html += `<input class="fill-input" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" data-k="${n - 1}" style="width:${w}ch" aria-label="Blank ${n} of BLANKS">`;
      }
    });
    return `<span class="line" data-n="${li + 1}"><span class="gutter" aria-hidden="true">${li + 1}</span><span class="src">${html || ' '}</span></span>`;
  }).join('').replace(/BLANKS/g, answers.length);
  box.innerHTML = `
    <div class="activity-title"><span class="activity-kind">Fill in the code</span></div>
    <p><strong>${b.prompt}</strong></p>
    <div class="code"><div class="code-bar"><span>${esc(b.file || 'main.cpp')}</span><span>${answers.length} blanks</span></div><pre><code>${lines}</code></pre></div>
    <div class="btn-row"><button type="button" class="btn primary" data-act="check">Check answers</button>
      <button type="button" class="btn" data-act="show">Show answers</button></div>
    ${b.hint ? `<details class="expander hint"><summary>Hint</summary><div class="expander-body"><div class="prose">${b.hint}</div></div></details>` : ''}
    <div class="feedback" role="status" aria-live="polite"></div>`;
  const inputs = [...box.querySelectorAll('.fill-input')];
  const fb = box.querySelector('.feedback');
  const norm = s => s.trim().replace(/\s+/g, ' ');
  box.querySelector('[data-act="check"]').addEventListener('click', () => {
    let right = 0;
    const wrongTips = [];
    inputs.forEach(inp => {
      const k = Number(inp.dataset.k);
      const ok = answers[k].some(a => norm(a) === norm(inp.value));
      inp.classList.toggle('ok', ok); inp.classList.toggle('no', !ok);
      if (ok) right++;
      else if (b.tips && b.tips[k]) wrongTips.push(`Blank ${k + 1}: ${b.tips[k]}`);
    });
    if (right === inputs.length) {
      fb.className = 'feedback good';
      fb.innerHTML = `<strong>All ${right} blanks correct.</strong> <span>${b.explain || ''}</span>`;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `<strong>${right} of ${inputs.length} correct.</strong> <span>The red blanks need another look. C++ is case-sensitive, so check capitals and spelling.</span>` +
        (wrongTips.length ? `<ul>${wrongTips.map(t => `<li>${t}</li>`).join('')}</ul>` : '');
    }
  });
  box.querySelector('[data-act="show"]').addEventListener('click', () => {
    inputs.forEach(inp => { inp.value = answers[inp.dataset.k][0]; inp.classList.add('ok'); inp.classList.remove('no'); });
    fb.className = 'feedback info';
    fb.innerHTML = `<strong>Answers filled in.</strong> <span>${b.explain || ''}</span>`;
  });
  return box;
}

/* ---------- 7. Code ordering ---------- */
function orderBlock(b) {
  const box = el('div', { class: 'activity' });
  const correct = b.lines.slice();
  let order = correct.map((_, i) => i);
  do { order = shuffle(order); } while (order.every((v, i) => v === i) && order.length > 1);
  box.innerHTML = `
    <div class="activity-title"><span class="activity-kind">Code ordering</span></div>
    <p><strong>${b.prompt}</strong></p>
    <p class="field-hint">Use the arrow buttons to move each line. The buttons work with the keyboard too.</p>
    <ol class="order-list" aria-label="Lines of code to put in order"></ol>
    <div class="btn-row"><button type="button" class="btn primary" data-act="check">Check order</button>
      <button type="button" class="btn" data-act="solve">Show correct order</button></div>
    ${b.hint ? `<details class="expander hint"><summary>Hint</summary><div class="expander-body"><div class="prose">${b.hint}</div></div></details>` : ''}
    <div class="feedback" role="status" aria-live="polite"></div>`;
  const list = box.querySelector('.order-list');
  const fb = box.querySelector('.feedback');
  const draw = (focusIdx, dir) => {
    list.innerHTML = order.map((ci, pos) => `
      <li class="order-item">
        <span class="pos">${pos + 1}</span>
        <span class="src">${hlLine(correct[ci]) || ' '}</span>
        <span class="moves">
          <button type="button" data-pos="${pos}" data-dir="-1" aria-label="Move line ${pos + 1} up" ${pos === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" data-pos="${pos}" data-dir="1" aria-label="Move line ${pos + 1} down" ${pos === order.length - 1 ? 'disabled' : ''}>↓</button>
        </span></li>`).join('');
    if (focusIdx != null) {
      // Keep focus on the line that just moved so it can be moved again.
      const same = list.querySelector(`[data-pos="${focusIdx}"][data-dir="${dir}"]:not([disabled])`);
      const other = list.querySelector(`[data-pos="${focusIdx}"]:not([disabled])`);
      (same || other)?.focus();
    }
  };
  list.addEventListener('click', e => {
    const btn = e.target.closest('button[data-pos]');
    if (!btn) return;
    const p = Number(btn.dataset.pos), d = Number(btn.dataset.dir), q = p + d;
    if (q < 0 || q >= order.length) return;
    [order[p], order[q]] = [order[q], order[p]];
    fb.className = 'feedback'; fb.innerHTML = '';
    draw(q, d);
  });
  box.querySelector('[data-act="check"]').addEventListener('click', () => {
    // Lines with identical text are interchangeable, so compare text, not index.
    const items = list.querySelectorAll('.order-item');
    let right = 0;
    order.forEach((ci, pos) => {
      const ok = correct[ci] === correct[pos];
      items[pos].classList.toggle('ok', ok); items[pos].classList.toggle('no', !ok);
      if (ok) right++;
    });
    if (right === order.length) {
      fb.className = 'feedback good';
      fb.innerHTML = `<strong>Correct order.</strong> <span>${b.explain || ''}</span>`;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `<strong>${right} of ${order.length} lines are in the right place.</strong> <span>${b.why || 'Think about what must exist before it can be used, and where each block opens and closes.'}</span>`;
    }
  });
  box.querySelector('[data-act="solve"]').addEventListener('click', () => {
    order = correct.map((_, i) => i);
    draw();
    list.querySelectorAll('.order-item').forEach(i => i.classList.add('ok'));
    fb.className = 'feedback info';
    fb.innerHTML = `<strong>This is the working order.</strong> <span>${b.explain || ''}</span>`;
  });
  draw();
  return box;
}

/* ---------- 8. Debugging challenge ---------- */
/* {title, prompt, code, bugLines:[n], compiler?, hints:[], fixed, explain} */
function debugBlock(b) {
  const box = el('div', { class: 'activity' });
  const fbId = uid('fb');
  box.innerHTML = `
    <div class="activity-title"><span class="activity-kind">Debugging</span>${b.title ? `<h4>${b.title}</h4>` : ''}</div>
    <p>${b.prompt || 'This program has a bug.'} <strong>Select the line you think is wrong.</strong></p>
    ${codeBlock(b.code, { file: b.file, clickable: true })}
    <div class="feedback" id="${fbId}" role="status" aria-live="polite"></div>
    ${b.compiler ? `<details class="expander hint"><summary>Show the compiler or runtime message</summary><div class="expander-body"><div class="console"><span class="err">${esc(b.compiler)}</span></div></div></details>` : ''}
    ${(b.hints || []).map((h, i) => `<details class="expander hint"><summary>Hint ${i + 1}</summary><div class="expander-body"><div class="prose">${h}</div></div></details>`).join('')}
    <div class="btn-row"><button type="button" class="btn" data-act="fix" aria-expanded="false">Reveal the fix</button></div>
    <div class="stack" data-fix hidden>
      <div class="feedback info"><strong>The fix:</strong> <span>${b.explain}</span></div>
      ${codeBlock(b.fixed, { file: b.file, highlight: b.fixedLines || b.bugLines })}
    </div>`;
  const fb = box.querySelector('#' + fbId);
  const firstCode = box.querySelector('.code');
  const pick = line => {
    const n = Number(line.dataset.n);
    firstCode.querySelectorAll('.line').forEach(l => l.classList.remove('picked-good', 'picked-bad'));
    const ok = b.bugLines.includes(n);
    line.classList.add(ok ? 'picked-good' : 'picked-bad');
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    fb.innerHTML = ok
      ? `<strong>Yes, line ${n} has the bug.</strong> <span>Now work out how to fix it, then reveal the fix to check.</span>`
      : `<strong>Line ${n} is fine.</strong> <span>${(b.lineNotes && b.lineNotes[n]) || 'That line is valid C++. Open a hint if you are stuck.'}</span>`;
  };
  firstCode.querySelectorAll('.line.clickable').forEach(line => {
    line.addEventListener('click', () => pick(line));
    line.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(line); } });
  });
  const fixBtn = box.querySelector('[data-act="fix"]');
  fixBtn.addEventListener('click', () => {
    const fix = box.querySelector('[data-fix]');
    fix.hidden = !fix.hidden;
    fixBtn.setAttribute('aria-expanded', !fix.hidden);
    fixBtn.textContent = fix.hidden ? 'Reveal the fix' : 'Hide the fix';
  });
  return box;
}

/* ---------- 9. Guided task / challenge ---------- */
/* {title, level, prompt, steps[], starter, output, hints[], solution, solutionNote} */
function taskBlock(b, ctx) {
  const key = b.key || `${ctx.page}-${ctx.n}`;
  const box = el('div', { class: 'activity' });
  const scratchId = uid('scratch');
  const solId = uid('sol');
  const savedSteps = Store.data.steps[key] || [];
  box.innerHTML = `
    <div class="activity-title">
      <span class="activity-kind">${b.kind || 'Task'}</span>
      ${b.level ? `<span class="level ${b.level.toLowerCase()}">${b.level}</span>` : ''}
      <h4>${b.title}</h4></div>
    <div class="prose">${b.prompt}</div>
    ${b.steps ? `<ul class="task-steps" aria-label="Steps">${b.steps.map((s, i) => `
      <li><label><input type="checkbox" data-step="${i}" ${savedSteps[i] ? 'checked' : ''}><span>${s}</span></label></li>`).join('')}</ul>` : ''}
    ${b.output ? `<div class="console-label">Example run</div><div class="console">${b.output}</div>` : ''}
    ${b.scratch === false ? '' : `<div class="field"><label for="${scratchId}">Your code <span class="field-hint">(scratchpad, saved in this browser, not compiled)</span></label>
      <textarea id="${scratchId}" class="scratch" spellcheck="false" autocapitalize="off">${esc(Store.data.scratch[key] ?? (b.starter || ''))}</textarea></div>`}
    ${(b.hints || []).map((h, i) => `<details class="expander hint"><summary>Hint ${i + 1}</summary><div class="expander-body"><div class="prose">${h}</div></div></details>`).join('')}
    ${b.solution ? `<div class="btn-row"><button type="button" class="btn" data-act="sol" aria-expanded="false" aria-controls="${solId}">Show a model solution</button></div>
      <div id="${solId}" class="stack" hidden>
        <p class="field-hint">Compare this with your own attempt. Different code can be equally correct.</p>
        ${codeBlock(b.solution, { file: b.file, playground: b.playground })}
        ${b.solutionNote ? `<div class="feedback info">${b.solutionNote}</div>` : ''}</div>` : ''}`;
  box.querySelectorAll('[data-step]').forEach(cb => cb.addEventListener('change', () => {
    const arr = Store.data.steps[key] || [];
    arr[Number(cb.dataset.step)] = cb.checked;
    Store.data.steps[key] = arr; Store.save();
  }));
  const ta = box.querySelector('textarea');
  if (ta) {
    let t;
    ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { Store.data.scratch[key] = ta.value; Store.save(); }, 400); });
    enableTabIndent(ta);
  }
  const solBtn = box.querySelector('[data-act="sol"]');
  if (solBtn) solBtn.addEventListener('click', () => {
    const sol = box.querySelector('#' + solId);
    sol.hidden = !sol.hidden;
    solBtn.setAttribute('aria-expanded', !sol.hidden);
    solBtn.textContent = sol.hidden ? 'Show a model solution' : 'Hide the model solution';
  });
  return box;
}

/**
 * Let Tab insert four spaces in a code textarea. Pressing Escape first
 * releases the next Tab so keyboard users can still leave the field.
 */
function enableTabIndent(ta) {
  let release = false;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { release = true; return; }
    if (e.key === 'Tab' && !e.shiftKey && !release) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      ta.dispatchEvent(new Event('input'));
    } else if (e.key !== 'Tab') release = false;
  });
  ta.setAttribute('aria-description', 'Tab inserts spaces. Press Escape then Tab to move focus out.');
}

/* ---------- 10. Matching (select per row) ---------- */
/* {prompt, options:[...], rows:[{v, a, why}], mono} */
function matchBlock(b) {
  const box = el('div', { class: 'activity' });
  box.innerHTML = `
    <div class="activity-title"><span class="activity-kind">${b.kind || 'Matching'}</span></div>
    <p><strong>${b.prompt}</strong></p>
    <div class="match-rows">${b.rows.map((r, i) => {
      const sid = uid('m');
      return `<div class="match-row" data-i="${i}">
        <label class="val" for="${sid}">${b.mono === false ? r.v : esc(r.v)}</label>
        <select id="${sid}"><option value="">Choose…</option>${b.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>
        <span class="mark" aria-hidden="true"></span>
        <span class="why" hidden></span></div>`;
    }).join('')}</div>
    <div class="btn-row"><button type="button" class="btn primary">Check matches</button></div>
    <div class="feedback" role="status" aria-live="polite"></div>`;
  const fb = box.querySelector('.feedback');
  box.querySelector('.btn.primary').addEventListener('click', () => {
    let right = 0;
    box.querySelectorAll('.match-row').forEach(row => {
      const r = b.rows[row.dataset.i];
      const val = row.querySelector('select').value;
      const ok = val === r.a;
      if (ok) right++;
      row.classList.toggle('ok', ok); row.classList.toggle('no', !ok);
      row.querySelector('.mark').textContent = ok ? '✓' : '✗';
      const why = row.querySelector('.why');
      why.hidden = ok || !val;
      why.innerHTML = !ok && val ? r.why : '';
    });
    const total = b.rows.length;
    fb.className = 'feedback ' + (right === total ? 'good' : 'bad');
    fb.innerHTML = right === total
      ? `<strong>All ${total} correct.</strong> <span>${b.explain || ''}</span>`
      : `<strong>${right} of ${total} correct.</strong> <span>Read the note under each red row, then try again.</span>`;
  });
  return box;
}

/* ---------- 11. Line-by-line walkthrough ---------- */
/* ex = {code, file, lines: [[spec, text], ...]} */
function walkthrough(ex) {
  const wrap = el('div', { class: 'stack' });
  const grid = el('div', { class: 'walk' });
  grid.innerHTML = codeBlock(ex.code, { file: ex.file });
  const side = el('div', { class: 'stack' });
  side.innerHTML = `
    <div class="btn-row"><button type="button" class="btn small" data-act="prev">← Previous line</button>
      <button type="button" class="btn small primary" data-act="next">Next line →</button></div>
    <ol class="walk-list">${ex.lines.map(([spec, text], i) => `
      <li><button type="button" class="walk-item" data-i="${i}" aria-pressed="false">
        <span class="walk-ln">${String(spec).includes('-') ? 'Lines ' : 'Line '}${spec}</span><span>${text}</span></button></li>`).join('')}</ol>`;
  grid.appendChild(side);
  wrap.appendChild(grid);
  const items = [...side.querySelectorAll('.walk-item')];
  const codeEl = grid.querySelector('.code');
  let cur = -1;
  const select = i => {
    cur = i;
    items.forEach((it, j) => it.setAttribute('aria-pressed', j === i));
    setCodeHighlight(codeEl, parseLines(ex.lines[i][0]));
  };
  items.forEach((it, i) => it.addEventListener('click', () => select(i)));
  side.querySelector('[data-act="next"]').addEventListener('click', () => select(Math.min(items.length - 1, cur + 1)));
  side.querySelector('[data-act="prev"]').addEventListener('click', () => select(Math.max(0, cur - 1)));
  return wrap;
}

/* ---------- 12. Simulated input/output helper ---------- */
/**
 * A tiny model of std::cin / std::cout used by the simulated programs.
 * Input is echoed the first time the program reads from each typed line,
 * which is how a real terminal shows what the user typed.
 */
function makeIO(stdin) {
  const text = stdin.replace(/\r/g, '');
  let pos = 0, echoedTo = -1, html = '';
  const lineEnd = p => { const e = text.indexOf('\n', p); return e < 0 ? text.length : e; };
  const echo = () => {
    // Echo every input line the read position has now reached.
    while (echoedTo < pos && echoedTo < text.length) {
      const start = echoedTo + 1;
      if (start >= text.length) break;
      const e = lineEnd(start);
      html += `<span class="in">${esc(text.slice(start, e))}</span>\n`;
      echoedTo = e;
    }
  };
  const skipWs = () => { while (pos < text.length && /\s/.test(text[pos])) pos++; };
  return {
    out(s) { html += esc(String(s)); },
    note(s) { html += `<span class="note">${esc(s)}</span>`; },
    err(s) { html += `<span class="err">${esc(s)}</span>`; },
    /** cin >> word */
    word() {
      skipWs();
      if (pos >= text.length) return null;
      const st = pos;
      while (pos < text.length && !/\s/.test(text[pos])) pos++;
      echo();
      return text.slice(st, pos);
    },
    /** cin >> int (reads leading digits; null on failure) */
    int() {
      const w = this.word();
      if (w == null) return null;
      const m = w.match(/^[+-]?\d+/);
      return m ? parseInt(m[0], 10) : null;
    },
    num() {
      const w = this.word();
      if (w == null) return null;
      const n = parseFloat(w);
      return isNaN(n) ? null : n;
    },
    /** std::getline */
    line() {
      if (pos > text.length) return null;
      const e = lineEnd(pos);
      const s = text.slice(pos, e);
      pos = e;
      echo();
      pos = e + 1;
      return s;
    },
    ignoreLine() { const e = lineEnd(pos); pos = e; echo(); pos = e + 1; },
    get html() { return html; }
  };
}

/** Format a double the way std::cout does by default (6 significant digits). */
function fmtDouble(x) {
  if (Number.isInteger(x)) return String(x);
  return String(parseFloat(x.toPrecision(6)));
}
