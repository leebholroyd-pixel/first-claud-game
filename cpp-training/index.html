  <script>
/* ==========================================================================
   widgets.js — interactive visualisers used inside lessons.
   Each widget is a function (host, opts) that builds its own UI in host.
   ========================================================================== */
'use strict';

const Widgets = {};

/* Shared: build a status/feedback element */
function statusEl(html = '') { return el('div', { class: 'viz-status', role: 'status', 'aria-live': 'polite' }, html); }

/* ---------- Build pipeline (Section 1) ---------- */
Widgets.pipeline = host => {
  const stages = [
    ['Source code', 'main.cpp', 'You write human-readable C++ in a text file, usually ending <code>.cpp</code>. Header files (<code>.h</code> / <code>.hpp</code>) hold declarations to share between files.'],
    ['Preprocessor', '#include', 'Runs first. It handles lines starting with <code>#</code>, for example copying the contents of <code>&lt;iostream&gt;</code> into your file so the compiler knows what <code>std::cout</code> is.'],
    ['Compiler', 'g++ / clang / MSVC', 'Checks your code follows the rules of C++ (syntax and types) and translates it into machine code for your processor. Errors found here are <strong>compile-time errors</strong>.'],
    ['Linker', 'main.o + libraries', 'Joins your compiled code with library code (such as the code that actually prints to the screen) into one file. Missing function definitions cause <strong>linker errors</strong>.'],
    ['Executable', 'main.exe / ./main', 'A complete program your operating system can run directly. You can run it again and again without recompiling, but if you change the source you must compile again.'],
    ['Run', 'Hello World!', 'The operating system loads the executable and starts it at <code>main()</code>. Problems that only appear now, such as dividing by zero, are <strong>run-time errors</strong>.']
  ];
  host.innerHTML = `
    <div class="pipeline" role="group" aria-label="Stages of building a C++ program">
      ${stages.map((s, i) => `${i ? '<span class="pipe-arrow" aria-hidden="true">→</span>' : ''}
        <button type="button" class="pipe-stage" data-i="${i}" aria-pressed="${i === 0}"><strong>${s[0]}</strong><small>${s[1]}</small></button>`).join('')}
    </div>`;
  const status = statusEl();
  host.appendChild(status);
  const show = i => {
    host.querySelectorAll('.pipe-stage').forEach((b, j) => b.setAttribute('aria-pressed', i === j));
    status.innerHTML = `<strong>${i + 1}. ${stages[i][0]}.</strong> ${stages[i][2]}`;
  };
  host.querySelectorAll('.pipe-stage').forEach(b => b.addEventListener('click', () => show(Number(b.dataset.i))));
  host.appendChild(el('div', { class: 'console' }, `<span class="note"># the same steps from a terminal</span>\n<span class="in">g++ -std=c++17 main.cpp -o main</span>\n<span class="in">./main</span>\nHello World!`));
  show(0);
};

/* ---------- Variable builder (Section 2) ---------- */
Widgets.varBuilder = host => {
  const ids = { t: uid('vt'), n: uid('vn'), v: uid('vv') };
  host.innerHTML = `
    <div class="viz-controls">
      <div class="field"><label for="${ids.t}">Type</label>
        <select id="${ids.t}">${['int', 'double', 'float', 'char', 'bool', 'std::string'].map(t => `<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="${ids.n}">Name</label><input id="${ids.n}" type="text" value="playerLives" spellcheck="false"></div>
      <div class="field"><label for="${ids.v}">Value</label><input id="${ids.v}" type="text" value="3" spellcheck="false"></div>
    </div>
    <div data-code></div>
    <div class="two-col"><div data-box></div><div data-msg></div></div>`;
  const t = host.querySelector('#' + ids.t), n = host.querySelector('#' + ids.n), v = host.querySelector('#' + ids.v);
  const examples = { int: '3', double: '19.99', float: '2.5f', char: "'A'", bool: 'true', 'std::string': '"Alex"' };
  const checkValue = (type, val) => {
    val = val.trim();
    switch (type) {
      case 'int':
        if (/^-?\d+$/.test(val)) return [true, 'A whole number fits an <code>int</code>.'];
        if (/^-?\d*\.\d+f?$/.test(val)) return [false, `C++ would <strong>truncate</strong> this to <code>${parseInt(val, 10) || 0}</code> and drop the decimal part. Use <code>double</code> for decimals.`];
        return [false, 'An <code>int</code> holds whole numbers only, with no quotes.'];
      case 'double':
        if (/^-?\d+(\.\d+)?$/.test(val)) return [true, 'A <code>double</code> stores decimals with about 15 significant digits.'];
        return [false, 'A <code>double</code> needs a number such as <code>19.99</code>, with no quotes.'];
      case 'float':
        if (/^-?\d+(\.\d+)?f$/.test(val)) return [true, 'The <code>f</code> suffix marks a float literal.'];
        if (/^-?\d+(\.\d+)?$/.test(val)) return [true, 'This works, but add an <code>f</code> (for example <code>2.5f</code>) to show it is a float literal rather than a double.'];
        return [false, 'A <code>float</code> needs a number, ideally with an <code>f</code> suffix.'];
      case 'char':
        if (/^'(\\.|[^'\\])'$/.test(val)) return [true, 'A <code>char</code> is exactly one character in <strong>single</strong> quotes.'];
        if (/^".*"$/.test(val)) return [false, 'Double quotes make a string. A <code>char</code> uses single quotes, for example <code>\'A\'</code>.'];
        return [false, 'A <code>char</code> is one character in single quotes, for example <code>\'A\'</code>.'];
      case 'bool':
        if (val === 'true' || val === 'false') return [true, 'A <code>bool</code> is either <code>true</code> or <code>false</code>. It prints as 1 or 0.'];
        if (/^(True|False|TRUE|FALSE)$/.test(val)) return [false, 'C++ is case-sensitive: write <code>true</code> or <code>false</code> in lower case.'];
        return [false, 'A <code>bool</code> can only be <code>true</code> or <code>false</code>.'];
      default:
        if (/^".*"$/.test(val)) return [true, 'Text goes in <strong>double</strong> quotes. Remember <code>#include &lt;string&gt;</code>.'];
        return [false, 'A string needs double quotes around the text, for example <code>"Alex"</code>.'];
    }
  };
  const checkName = name => {
    if (!name) return [false, 'Give the variable a name.'];
    if (/^\d/.test(name)) return [false, 'Names cannot start with a digit.'];
    if (!/^[A-Za-z_]\w*$/.test(name)) return [false, 'Use only letters, digits and underscores. No spaces or symbols.'];
    if (CPP_KEYWORDS.has(name) || CPP_TYPES.has(name)) return [false, `<code>${esc(name)}</code> is a reserved word in C++.`];
    if (name.length < 2) return [true, 'Valid, but a longer, descriptive name is easier to read.'];
    return [true, /^[a-z]+([A-Z][a-z0-9]*)*$/.test(name) ? 'Valid camelCase name.' : 'Valid name.'];
  };
  const update = () => {
    const [nOk, nMsg] = checkName(n.value.trim());
    const [vOk, vMsg] = checkValue(t.value, v.value);
    const line = `${t.value} ${n.value.trim() || '?'} = ${v.value.trim() || '?'};`;
    host.querySelector('[data-code]').innerHTML = codeBlock(line, { file: 'declaration' });
    host.querySelector('[data-box]').innerHTML = `
      <div class="var-box" aria-label="Memory box for the variable">
        <span class="t">${esc(t.value)}</span><span class="n">${esc(n.value.trim() || '?')}</span>
        <span class="v">${nOk && vOk ? esc(v.value.trim()) : '⚠'}</span></div>`;
    host.querySelector('[data-msg]').innerHTML = `
      <div class="feedback ${nOk ? 'good' : 'bad'}"><strong>Name:</strong> <span>${nMsg}</span></div>
      <div class="feedback ${vOk ? 'good' : 'bad'}" style="margin-top:8px"><strong>Value:</strong> <span>${vMsg}</span></div>`;
  };
  t.addEventListener('change', () => { v.value = examples[t.value]; update(); });
  n.addEventListener('input', update); v.addEventListener('input', update);
  update();
};

/* ---------- Simulated program with keyboard input (Sections 3, 10) ---------- */
/* opts: {code, file, stdin, run(io), presets:[[label, stdin]]} */
Widgets.simProgram = (host, opts) => {
  const inId = uid('stdin');
  const prog = typeof opts.program === 'string' ? Programs[opts.program] : opts;
  host.innerHTML = `
    ${codeBlock(prog.code, { file: prog.file })}
    <div class="field"><label for="${inId}">Keyboard input <span class="field-hint">(what the user types, one line per Enter press)</span></label>
      <textarea id="${inId}" rows="${Math.max(2, (prog.stdin || '').split('\n').length)}" spellcheck="false" style="font-family:var(--font-mono)">${esc(prog.stdin || '')}</textarea></div>
    <div class="btn-row"><button type="button" class="btn primary" data-run>Run (simulated)</button>
      ${(opts.presets || []).map((p, i) => `<button type="button" class="btn" data-preset="${i}">Try: ${esc(p[0])}</button>`).join('')}</div>
    <div class="console-label">Simulated console</div>
    <div class="console" role="status" aria-live="polite"><span class="note">Press Run to see the output.</span></div>
    ${opts.note ? `<div class="feedback info" data-note hidden>${opts.note}</div>` : ''}`;
  const ta = host.querySelector('textarea'), con = host.querySelector('.console');
  const run = () => {
    const io = makeIO(ta.value);
    try { prog.run(io); } catch (e) { io.err('\n[simulation error]'); }
    con.innerHTML = io.html + '\n<span class="note">[Program finished]</span>';
    const note = host.querySelector('[data-note]');
    if (note) note.hidden = false;
  };
  host.querySelector('[data-run]').addEventListener('click', run);
  host.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    ta.value = opts.presets[b.dataset.preset][1]; run();
  }));
};

/* ---------- Expression evaluator (Section 4) ---------- */
Widgets.exprEval = host => {
  const ids = { x: uid('x'), y: uid('y'), op: uid('op'), ty: uid('ty') };
  const ops = ['+', '-', '*', '/', '%', '==', '!=', '<', '>', '<=', '>=', '&&', '||'];
  host.innerHTML = `
    <div class="viz-controls">
      <div class="field"><label for="${ids.ty}">Type of x and y</label><select id="${ids.ty}"><option>int</option><option>double</option></select></div>
      <div class="field"><label for="${ids.x}">x</label><input id="${ids.x}" type="number" value="10" step="any" style="width:7em"></div>
      <div class="field"><label for="${ids.op}">Operator</label><select id="${ids.op}">${ops.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
      <div class="field"><label for="${ids.y}">y</label><input id="${ids.y}" type="number" value="4" step="any" style="width:7em"></div>
    </div>
    <div data-code></div>
    <div data-out></div>`;
  const $ = id => host.querySelector('#' + id);
  const update = () => {
    const ty = $(ids.ty).value;
    let x = Number($(ids.x).value), y = Number($(ids.y).value);
    if (ty === 'int') { x = Math.trunc(x); y = Math.trunc(y); }
    const op = $(ids.op).value;
    const fmt = n => ty === 'int' ? String(n) : fmtDouble(n);
    let result, note = '', err = false;
    switch (op) {
      case '+': result = fmt(x + y); break;
      case '-': result = fmt(x - y); break;
      case '*': result = fmt(x * y); break;
      case '/':
        if (y === 0) { err = true; note = ty === 'int' ? 'Integer division by zero is undefined behaviour. The program may crash.' : 'Dividing a double by zero gives <code>inf</code> (or <code>nan</code> for 0/0) rather than an error.'; result = ty === 'int' ? '??' : (x === 0 ? 'nan' : (x > 0 ? 'inf' : '-inf')); }
        else if (ty === 'int') { result = String(Math.trunc(x / y)); note = `Both operands are <code>int</code>, so this is <strong>integer division</strong>. The exact answer ${fmtDouble(x / y)} is truncated towards zero.`; }
        else result = fmt(x / y);
        break;
      case '%':
        if (ty === 'double') { err = true; result = 'compile error'; note = '<code>%</code> only works with integer types. For doubles use <code>std::fmod</code> from <code>&lt;cmath&gt;</code>.'; }
        else if (y === 0) { err = true; result = '??'; note = 'Modulus by zero is undefined behaviour.'; }
        else { result = String(x % y); note = `<code>%</code> gives the remainder: ${x} ÷ ${y} = ${Math.trunc(x / y)} remainder ${x % y}. The sign of the result follows x.`; }
        break;
      case '&&': case '||': {
        const bx = x !== 0, by = y !== 0;
        const r = op === '&&' ? bx && by : bx || by;
        result = r ? '1' : '0';
        note = `Numbers convert to bool: 0 is false and anything else is true. So this is <code>${bx} ${op} ${by}</code>, which is <code>${r}</code>. <code>std::cout</code> prints a bool as 1 or 0 unless you use <code>std::boolalpha</code>.`;
        break;
      }
      default: {
        const r = { '==': x === y, '!=': x !== y, '<': x < y, '>': x > y, '<=': x <= y, '>=': x >= y }[op];
        result = r ? '1' : '0';
        note = `A comparison produces a <code>bool</code>: <code>${r}</code>. It prints as <code>${result}</code>.`;
      }
    }
    const code = `${ty} x = ${fmt(x)};\n${ty} y = ${fmt(y)};\nstd::cout << (x ${op} y);`;
    host.querySelector('[data-code]').innerHTML = codeBlock(code, { file: 'expression' });
    host.querySelector('[data-out]').innerHTML = `<div class="console-label">Output</div><div class="console">${err ? `<span class="err">${esc(result)}</span>` : esc(result)}</div>
      ${note ? `<div class="feedback ${err ? 'bad' : 'info'}" style="margin-top:8px">${note}</div>` : ''}`;
  };
  host.querySelectorAll('input, select').forEach(i => i.addEventListener('input', update));
  update();
};

Widgets.gradeBuilder = host => {
  let branches = [
    { grade: 'Pass', min: 40 },
    { grade: 'Distinction', min: 70 },
    { grade: 'Merit', min: 60 }
  ];
  const expected = s => (s >= 70 ? 'Distinction' : s >= 60 ? 'Merit' : s >= 40 ? 'Pass' : 'Fail');
  const tests = [95, 70, 69, 60, 59, 40, 39, 0];
  host.innerHTML = `
    <p>The rules: <strong>Distinction</strong> 70 and above, <strong>Merit</strong> 60–69, <strong>Pass</strong> 40–59, otherwise <strong>Fail</strong>.
      The branches below start in the wrong order. Reorder them and set each threshold until every test passes.</p>
    <div class="two-col"><div class="stack"><ol class="order-list" data-rows aria-label="if / else if branches"></ol>
      <div class="cond">else → "Fail"</div></div>
      <div data-code></div></div>
    <div class="console-label">Automatic tests</div>
    <div class="table-wrap"><table><thead><tr><th scope="col">score</th><th scope="col">Expected</th><th scope="col">Your code gives</th><th scope="col">Result</th></tr></thead><tbody data-tests></tbody></table></div>
    <div class="feedback" role="status" aria-live="polite" data-fb></div>`;
  const rows = host.querySelector('[data-rows]');
  const draw = focus => {
    rows.innerHTML = branches.map((b, i) => `
      <li class="order-item" style="grid-template-columns:auto minmax(0,1fr) auto">
        <span class="pos">${i === 0 ? 'if' : 'else if'}</span>
        <span class="src">score &gt;= <input class="fill-input" type="number" min="0" max="100" value="${b.min}" data-min="${i}" aria-label="Threshold for ${b.grade}" style="width:6ch"> → "${b.grade}"</span>
        <span class="moves"><button type="button" data-mv="${i}" data-d="-1" aria-label="Move ${b.grade} up" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" data-mv="${i}" data-d="1" aria-label="Move ${b.grade} down" ${i === branches.length - 1 ? 'disabled' : ''}>↓</button></span></li>`).join('');
    if (focus) rows.querySelector(focus)?.focus();
    evaluate();
  };
  const evaluate = () => {
    const code = ['if (score >= ' + branches[0].min + ')', '{', `    grade = "${branches[0].grade}";`, '}'];
    branches.slice(1).forEach(b => code.push(`else if (score >= ${b.min})`, '{', `    grade = "${b.grade}";`, '}'));
    code.push('else', '{', '    grade = "Fail";', '}');
    host.querySelector('[data-code]').innerHTML = codeBlock(code.join('\n'), { file: 'grading.cpp' });
    let pass = 0;
    host.querySelector('[data-tests]').innerHTML = tests.map(s => {
      const got = (branches.find(b => s >= b.min) || { grade: 'Fail' }).grade;
      const ok = got === expected(s);
      if (ok) pass++;
      return `<tr><td>${s}</td><td>${expected(s)}</td><td>${got}</td><td style="color:var(${ok ? '--good' : '--bad'});font-weight:700">${ok ? '✓ pass' : '✗ fail'}</td></tr>`;
    }).join('');
    const fb = host.querySelector('[data-fb]');
    if (pass === tests.length) {
      fb.className = 'feedback good';
      fb.innerHTML = '<strong>All tests pass.</strong> <span>The highest threshold must be checked first. Once a condition is true, C++ skips every remaining <code>else if</code>.</span>';
    } else {
      const firstMin = branches[0].min;
      fb.className = 'feedback bad';
      fb.innerHTML = `<strong>${pass} of ${tests.length} tests pass.</strong> <span>${branches.some((b, i) => i && b.min > branches[i - 1].min)
        ? `A lower threshold is checked before a higher one. A score of 95 meets <code>score &gt;= ${firstMin}</code> first, so later branches never run.`
        : 'The order looks right. Check each threshold against the rules, including the boundary values 70, 60 and 40.'}</span>`;
    }
  };
  rows.addEventListener('click', e => {
    const b = e.target.closest('[data-mv]');
    if (!b) return;
    const i = Number(b.dataset.mv), j = i + Number(b.dataset.d);
    [branches[i], branches[j]] = [branches[j], branches[i]];
    draw(`[data-mv="${j}"][data-d="${b.dataset.d}"]:not([disabled])`);
  });
  rows.addEventListener('input', e => {
    const inp = e.target.closest('[data-min]');
    if (!inp) return;
    branches[inp.dataset.min].min = Number(inp.value);
    evaluate();
  });
  draw();
};

/* ---------- Generic trace stepper ---------- */
/* Builds steps: {line(s), note, cond, vars, changed, out} */
function Tracer() {
  const steps = [];
  let vars = {}, out = '';
  return {
    step(line, note, o = {}) {
      if (o.set) vars = { ...vars, ...o.set };
      if (o.del) o.del.forEach(k => delete vars[k]);
      if (o.out) out += o.out;
      steps.push({ line, note, cond: o.cond || null, vars: { ...vars }, changed: o.set ? Object.keys(o.set) : [], out });
    },
    steps
  };
}
const condHtml = (expr, sub, val) => `${esc(expr)} → ${esc(sub)} → <span class="${val ? 't' : 'f'}">${val}</span>`;

/**
 * Step-through visualiser. opts.presets = [{label, code, gen()}] or opts.code + opts.steps.
 * Shows: current line, condition being checked, variables, and output.
 */
Widgets.stepper = (host, opts) => {
  const presets = opts.presets || [{ label: '', code: opts.code, gen: () => opts.steps }];
  const selId = uid('preset');
  host.innerHTML = `
    ${presets.length > 1 ? `<div class="viz-controls"><div class="field"><label for="${selId}">Choose an example</label>
      <select id="${selId}">${presets.map((p, i) => `<option value="${i}">${esc(p.label)}</option>`).join('')}</select></div></div>` : ''}
    <div class="trace-grid"><div class="stack" data-codewrap></div>
      <div class="stack">
        <div class="btn-row">
          <button type="button" class="btn small" data-act="back">← Back</button>
          <button type="button" class="btn small primary" data-act="next">Next step →</button>
          <button type="button" class="btn small" data-act="end">Run to end</button>
          <button type="button" class="btn small ghost" data-act="reset">Reset</button>
        </div>
        <span class="step-count" data-count></span>
        <div class="viz-status" data-note role="status" aria-live="polite"></div>
        <div><div class="console-label">${opts.condLabel || 'Condition being checked'}</div><div class="cond" data-cond></div></div>
        <div><div class="console-label">Code being executed</div><div class="cond" data-exec></div></div>
        <div><div class="console-label">Variables</div><div class="table-wrap"><table class="state-table"><tbody data-vars></tbody></table></div></div>
        <div><div class="console-label">Output</div><div class="console" data-out></div></div>
      </div></div>`;
  let preset, steps, i, lines;
  const load = p => {
    preset = presets[p];
    steps = preset.gen();
    lines = preset.code.split('\n');
    host.querySelector('[data-codewrap]').innerHTML = codeBlock(preset.code, { file: preset.file || 'main.cpp' });
    i = 0; render();
  };
  const render = () => {
    const s = steps[i];
    const ls = parseLines(s.line);
    setCodeHighlight(host.querySelector('[data-codewrap] .code'), ls);
    host.querySelector('[data-count]').textContent = `Step ${i + 1} of ${steps.length}`;
    host.querySelector('[data-note]').innerHTML = s.note;
    host.querySelector('[data-cond]').innerHTML = s.cond || '<span style="color:var(--muted)">No condition checked on this step</span>';
    host.querySelector('[data-exec]').innerHTML = ls.map(n => hlLine((lines[n - 1] || '').trim())).join('<br>');
    const keys = Object.keys(s.vars);
    host.querySelector('[data-vars]').innerHTML = keys.length
      ? keys.map(k => `<tr class="${s.changed.includes(k) ? 'changed' : ''}"><td>${esc(k)}</td><td>${esc(s.vars[k])}</td></tr>`).join('')
      : '<tr><td colspan="2" style="color:var(--muted);font-family:var(--font-body)">No variables yet</td></tr>';
    host.querySelector('[data-out]').textContent = s.out || '';
    host.querySelector('[data-act="back"]').disabled = i === 0;
    host.querySelector('[data-act="next"]').disabled = i === steps.length - 1;
    host.querySelector('[data-act="end"]').disabled = i === steps.length - 1;
  };
  host.querySelector('[data-act="next"]').addEventListener('click', () => { if (i < steps.length - 1) { i++; render(); } });
  host.querySelector('[data-act="back"]').addEventListener('click', () => { if (i > 0) { i--; render(); } });
  host.querySelector('[data-act="end"]').addEventListener('click', () => { i = steps.length - 1; render(); });
  host.querySelector('[data-act="reset"]').addEventListener('click', () => { i = 0; render(); });
  const sel = host.querySelector('#' + selId);
  if (sel) sel.addEventListener('change', () => load(Number(sel.value)));
  load(0);
};

/* Loop presets for the loop visualiser (Section 6) */
const LoopPresets = [
  {
    label: 'for loop: count 1 to 5',
    code: cpp`
      for (int i = 1; i <= 5; i++)
      {
          std::cout << i << std::endl;
      }
      std::cout << "Done";`,
    gen() {
      const t = Tracer();
      t.step(1, '<strong>Initialise.</strong> <code>int i = 1</code> runs once, before the first check.', { set: { i: 1 } });
      let i = 1;
      for (;;) {
        const ok = i <= 5;
        t.step(1, ok ? '<strong>Check.</strong> The condition is true, so the body runs.' : '<strong>Check.</strong> The condition is false, so the loop ends.', { cond: condHtml('i <= 5', `${i} <= 5`, ok) });
        if (!ok) break;
        t.step(3, `<strong>Body.</strong> Print <code>i</code> (${i}) and a new line.`, { out: i + '\n' });
        i++;
        t.step(1, `<strong>Update.</strong> <code>i++</code> adds 1, so i is now ${i}.`, { set: { i } });
      }
      t.step(5, 'The loop has finished. The program carries on with the next statement.', { out: 'Done', del: ['i'] });
      return t.steps;
    }
  },
  {
    label: 'for + continue: even numbers',
    code: cpp`
      for (int i = 1; i <= 6; i++)
      {
          if (i % 2 != 0)
              continue;
          std::cout << i << " ";
      }`,
    gen() {
      const t = Tracer();
      t.step(1, '<strong>Initialise</strong> i to 1.', { set: { i: 1 } });
      let i = 1;
      for (;;) {
        const ok = i <= 6;
        t.step(1, ok ? 'Loop condition is true.' : 'Loop condition is false, so the loop ends.', { cond: condHtml('i <= 6', `${i} <= 6`, ok) });
        if (!ok) break;
        const odd = i % 2 !== 0;
        t.step(3, odd ? `${i} is odd, so the if condition is true.` : `${i} is even, so the if condition is false.`, { cond: condHtml('i % 2 != 0', `${i} % 2 != 0 → ${i % 2} != 0`, odd) });
        if (odd) t.step(4, '<code>continue</code> skips the rest of the body and jumps straight to the update.');
        else t.step(5, `Print ${i}.`, { out: i + ' ' });
        i++;
        t.step(1, `<strong>Update.</strong> i is now ${i}.`, { set: { i } });
      }
      return t.steps;
    }
  },
  {
    label: 'while loop: countdown',
    code: cpp`
      int count = 3;
      while (count > 0)
      {
          std::cout << count << "... ";
          count--;
      }
      std::cout << "Lift off!";`,
    gen() {
      const t = Tracer();
      t.step(1, 'Create <code>count</code> before the loop. A while loop does not have its own initialiser.', { set: { count: 3 } });
      let c = 3;
      for (;;) {
        const ok = c > 0;
        t.step(2, ok ? 'The condition is checked <strong>before</strong> each pass. It is true.' : 'The condition is false, so the loop ends.', { cond: condHtml('count > 0', `${c} > 0`, ok) });
        if (!ok) break;
        t.step(4, `Print ${c}.`, { out: `${c}... ` });
        c--;
        t.step(5, `<code>count--</code> subtracts 1. Without this line the loop would never end.`, { set: { count: c } });
      }
      t.step(7, 'After the loop.', { out: 'Lift off!' });
      return t.steps;
    }
  },
  {
    label: 'do...while: always runs once',
    code: cpp`
      int n = 10;
      do
      {
          std::cout << n << " ";
          n++;
      } while (n < 5);
      std::cout << "End";`,
    gen() {
      const t = Tracer();
      t.step(1, 'Set n to 10.', { set: { n: 10 } });
      t.step(2, '<code>do</code> enters the body straight away. There is no check yet.');
      t.step(4, 'Print 10. The body runs even though 10 &lt; 5 is false.', { out: '10 ' });
      t.step(5, 'n becomes 11.', { set: { n: 11 } });
      t.step(6, 'The condition is checked <strong>after</strong> the body. It is false, so the loop ends after one pass.', { cond: condHtml('n < 5', '11 < 5', false) });
      t.step(7, 'After the loop.', { out: 'End' });
      return t.steps;
    }
  },
  {
    label: 'Nested loops: 3 × 3 table',
    code: cpp`
      for (int row = 1; row <= 3; row++)
      {
          for (int col = 1; col <= 3; col++)
          {
              std::cout << row * col << "\t";
          }
          std::cout << std::endl;
      }`,
    gen() {
      const t = Tracer();
      t.step(1, 'Outer loop: <code>row</code> starts at 1.', { set: { row: 1 } });
      for (let r = 1; ; r++) {
        if (r > 1) t.step(1, `Outer update: row is now ${r}.`, { set: { row: r }, del: ['col'] });
        const ok = r <= 3;
        t.step(1, ok ? 'Outer condition true.' : 'Outer condition false. Both loops are finished.', { cond: condHtml('row <= 3', `${r} <= 3`, ok) });
        if (!ok) break;
        t.step(3, 'Inner loop starts again from <code>col = 1</code> for every row.', { set: { col: 1 } });
        for (let c = 1; ; c++) {
          if (c > 1) t.step(3, `Inner update: col is now ${c}.`, { set: { col: c } });
          const ok2 = c <= 3;
          t.step(3, ok2 ? 'Inner condition true.' : 'Inner condition false. Back to the outer loop.', { cond: condHtml('col <= 3', `${c} <= 3`, ok2) });
          if (!ok2) break;
          t.step(5, `Print row × col = ${r} × ${c} = ${r * c}, then a tab.`, { out: `${r * c}\t` });
        }
        t.step(7, 'End of the row: print a new line.', { out: '\n' });
      }
      return t.steps;
    }
  },
  {
    label: 'for + break: search an array',
    code: cpp`
      int nums[5] = {4, 8, 15, 16, 23};
      for (int i = 0; i < 5; i++)
      {
          if (nums[i] == 15)
          {
              std::cout << "Found at index " << i;
              break;
          }
      }`,
    gen() {
      const t = Tracer();
      const nums = [4, 8, 15, 16, 23];
      t.step(1, 'Create the array.', { set: { nums: '{4, 8, 15, 16, 23}' } });
      t.step(2, 'i starts at 0 because array indexes start at 0.', { set: { i: 0 } });
      for (let i = 0; ; i++) {
        if (i > 0) t.step(2, `Update: i is now ${i}.`, { set: { i } });
        t.step(2, 'Condition true.', { cond: condHtml('i < 5', `${i} < 5`, true) });
        const hit = nums[i] === 15;
        t.step(4, hit ? 'Match found.' : 'Not a match, keep looking.', { cond: condHtml('nums[i] == 15', `${nums[i]} == 15`, hit) });
        if (hit) {
          t.step(6, 'Print where it was found.', { out: `Found at index ${i}` });
          t.step(7, '<code>break</code> exits the loop immediately. Indexes 3 and 4 are never checked.');
          break;
        }
      }
      return t.steps;
    }
  }
];

            <div class="slot" data-s="y"><span>y</span><span data-v="y"></span></div>
            <div class="slot" data-s="result"><span>result</span><span data-v="result"></span></div></div>
          <div class="flow-mid" aria-hidden="true"><span class="arrow" data-arrow></span><span data-carry></span></div>
          <div class="frame" data-f="add"><h4>addNumbers()</h4>
            <div class="slot" data-s="a"><span>a</span><span data-v="a"></span></div>
            <div class="slot" data-s="b"><span>b</span><span data-v="b"></span></div>
            <div class="slot" data-s="ret"><span>returns</span><span data-v="ret"></span></div></div>
        </div>
        <div><div class="console-label">Output</div><div class="console" data-out></div></div>
      </div></div>`;
  host.querySelector('[data-code]').innerHTML = codeBlock(code, { file: 'functions.cpp' });
  let i = 0;
  const steps = (x, y) => [
    { line: [6, 8, 9], f: 'main', hot: ['x', 'y'], v: { x, y }, note: 'The program starts in <code>main()</code>. It creates x and y.' },
    { line: 10, f: 'main', hot: [], v: { x, y }, arrow: '→', carry: `${x}, ${y}`, note: `<code>addNumbers(x, y)</code> is a <strong>function call</strong>. The <strong>arguments</strong> are the values ${x} and ${y}.` },
    { line: 1, f: 'add', hot: ['a', 'b'], v: { x, y, a: x, b: y }, arrow: '→', carry: `${x}, ${y}`, note: `The arguments are <strong>copied</strong> into the <strong>parameters</strong> a and b. Changing a inside the function would not change x.` },
    { line: 3, f: 'add', hot: ['ret'], v: { x, y, a: x, b: y, ret: x + y }, note: `The body runs: <code>a + b</code> is ${x} + ${y} = ${x + y}.` },
    { line: [3, 10], f: 'main', hot: ['result'], v: { x, y, ret: x + y, result: x + y }, arrow: '←', carry: String(x + y), note: `<code>return</code> sends ${x + y} back to the call site. The call expression is replaced by the <strong>return value</strong>, which is stored in result. a and b no longer exist.` },
    { line: 11, f: 'main', hot: [], v: { x, y, result: x + y }, out: String(x + y), note: 'main() prints result.' }
  ];
  const render = () => {
    const x = Math.trunc(Number(host.querySelector('#' + ids.x).value) || 0);
    const y = Math.trunc(Number(host.querySelector('#' + ids.y).value) || 0);
    const all = steps(x, y), s = all[i];
    setCodeHighlight(host.querySelector('[data-code] .code'), parseLines(s.line));
    host.querySelector('[data-count]').textContent = `Step ${i + 1} of ${all.length}`;
    host.querySelector('[data-note]').innerHTML = s.note;
    host.querySelectorAll('[data-f]').forEach(f => f.classList.toggle('on', f.dataset.f === s.f));
    host.querySelectorAll('[data-s]').forEach(sl => sl.classList.toggle('on', s.hot.includes(sl.dataset.s)));
    ['x', 'y', 'result', 'a', 'b', 'ret'].forEach(k => (host.querySelector(`[data-v="${k}"]`).textContent = s.v[k] ?? '—'));
    host.querySelector('[data-arrow]').textContent = s.arrow || '';
    host.querySelector('[data-carry]').textContent = s.carry || '';
    host.querySelector('[data-out]').textContent = s.out || '';
    host.querySelector('[data-act="back"]').disabled = i === 0;
    host.querySelector('[data-act="next"]').disabled = i === all.length - 1;
  };
  host.querySelector('[data-act="next"]').addEventListener('click', () => { i = Math.min(5, i + 1); render(); });
  host.querySelector('[data-act="back"]').addEventListener('click', () => { i = Math.max(0, i - 1); render(); });
  host.querySelector('[data-act="reset"]').addEventListener('click', () => { i = 0; render(); });
  host.querySelectorAll('input').forEach(inp => inp.addEventListener('input', render));
  render();
};

/* ---------- Array visualiser (Section 8) ---------- */
Widgets.arrayVisualiser = host => {
  const vals = [10, 20, 30, 40, 50];
  const ids = { i: uid('ai'), v: uid('av') };
  host.innerHTML = `
    <div data-decl></div>
    <div class="cells" data-cells role="group" aria-label="Array elements. Select an index."></div>
    <div class="viz-controls">
      <div class="field"><label for="${ids.i}">Index</label><input id="${ids.i}" type="number" value="0" style="width:6em"></div>
      <div class="field"><label for="${ids.v}">New value</label><input id="${ids.v}" type="number" value="99" style="width:6em"></div>
      <div class="btn-row"><button type="button" class="btn" data-act="read">Read scores[i]</button>
        <button type="button" class="btn" data-act="write">Assign scores[i] = value</button>
        <button type="button" class="btn primary" data-act="loop">Loop through (next step)</button>
        <button type="button" class="btn ghost" data-act="reset">Reset</button></div>
    </div>
    <div class="viz-status" data-msg role="status" aria-live="polite"></div>
    <div class="console" data-out></div>`;
  const cells = host.querySelector('[data-cells]');
  const idx = host.querySelector('#' + ids.i), nv = host.querySelector('#' + ids.v);
  const msg = host.querySelector('[data-msg]'), out = host.querySelector('[data-out]');
  let active = -1, loopI = -1, sum = 0, visited = new Set();
  const draw = () => {
    host.querySelector('[data-decl]').innerHTML = codeBlock(`int scores[5] = {${vals.join(', ')}};`, { file: 'array' });
    cells.innerHTML = vals.map((v, i) => `<button type="button" class="cell${i === active ? ' active' : ''}${visited.has(i) ? ' visited' : ''}" data-i="${i}" aria-label="Index ${i}, value ${v}">
      <span class="cv">${v}</span><span class="ci">[${i}]</span></button>`).join('') +
      `<span class="cell ghost" aria-hidden="true"><span class="cv">?</span><span class="ci">[5]</span></span>`;
  };
  const read = i => {
    if (i < 0 || i >= vals.length) {
      active = -1; draw();
      msg.innerHTML = `<strong style="color:var(--bad)">scores[${i}] is out of bounds.</strong> Valid indexes are 0 to 4. C++ does not stop you: it reads whatever memory is there, which is <strong>undefined behaviour</strong>. The program might print rubbish, crash, or seem to work.`;
      return;
    }
    active = i; draw();
    msg.innerHTML = `<code>scores[${i}]</code> is <strong>${vals[i]}</strong>. That is element number ${i + 1}, because indexing starts at 0.`;
  };
  cells.addEventListener('click', e => { const c = e.target.closest('[data-i]'); if (c) { idx.value = c.dataset.i; read(Number(c.dataset.i)); } });
  host.querySelector('[data-act="read"]').addEventListener('click', () => read(Math.trunc(Number(idx.value))));
  host.querySelector('[data-act="write"]').addEventListener('click', () => {
    const i = Math.trunc(Number(idx.value)), v = Math.trunc(Number(nv.value));
    if (i < 0 || i >= vals.length) { read(i); return; }
    vals[i] = v; active = i; draw();
    msg.innerHTML = `<code>scores[${i}] = ${v};</code> replaced the value at index ${i}. The other elements are unchanged.`;
  });
  host.querySelector('[data-act="loop"]').addEventListener('click', () => {
    if (loopI === -1) { sum = 0; visited = new Set(); out.textContent = ''; }
    loopI++;
    if (loopI >= vals.length) {
      msg.innerHTML = `<code>i &lt; 5</code> → ${loopI} &lt; 5 → <strong>false</strong>. The loop stops before index 5, so it never goes out of bounds. Total = ${sum}, average = ${fmtDouble(sum / vals.length)}.`;
      loopI = -1; active = -1; draw(); return;
    }
    sum += vals[loopI]; visited.add(loopI); active = loopI; draw();
    out.textContent += `scores[${loopI}] = ${vals[loopI]}\n`;
    msg.innerHTML = `<code>for (int i = 0; i &lt; 5; i++)</code>: i = ${loopI}. Running total = ${sum}.`;
  });
  host.querySelector('[data-act="reset"]').addEventListener('click', () => {
    vals.splice(0, 5, 10, 20, 30, 40, 50); active = -1; loopI = -1; visited = new Set(); out.textContent = ''; msg.innerHTML = 'Select an index to see its value.'; draw();
  });
  draw();
  msg.innerHTML = 'Select an index to see its value.';
};

  let hl = -1;
  const draw = () => {
    cells.innerHTML = v.length ? v.map((x, i) => `<span class="cell${i === hl ? ' active' : ''}"><span class="cv">${x}</span><span class="ci">[${i}]</span></span>`).join('')
      : '<span class="field-hint">The vector is empty.</span>';
  };
  const add = s => { log.innerHTML += esc(s) + '\n'; log.scrollTop = log.scrollHeight; };
  host.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
    const val = Math.trunc(Number(host.querySelector('#' + ids.val).value) || 0);
    const i = Math.trunc(Number(host.querySelector('#' + ids.idx).value) || 0);
    hl = -1;
    switch (b.dataset.op) {

      case 'pop':

      case 'size': add('std::cout << scores.size();'); msg.innerHTML = `<code>size()</code> returns <strong>${v.length}</strong>. Valid indexes are ${v.length ? `0 to ${v.length - 1}` : 'none (empty)'}.`; break;
      case 'clear': add('scores.clear();'); v = []; msg.innerHTML = 'All elements removed. size() is now 0.'; break;

        if (i < 0 || i >= v.length) msg.innerHTML = `<strong style="color:var(--bad)">at(${i}) throws std::out_of_range.</strong> at() checks the index, so the mistake is reported instead of silently reading bad memory.`;
        else { hl = i; msg.innerHTML = `<code>scores.at(${i})</code> is ${v[i]}.`; }
        break;
      case 'sq':
        add(`std::cout << scores[${i}];`);
        if (i < 0 || i >= v.length) msg.innerHTML = `<strong style="color:var(--bad)">scores[${i}] is undefined behaviour.</strong> Square brackets do no checking, exactly like arrays. Use <code>at()</code> while learning.`;
        else { hl = i; msg.innerHTML = `<code>scores[${i}]</code> is ${v[i]}.`; }
        break;
    }
    draw();
  }));
  draw();
};

/* ---------- Memory diagram: references and pointers (Section 11) ---------- */
Widgets.memoryDiagram = host => {
  const code = cpp`
    int score = 50;
    int& ref = score;
    int* ptr = &score;
    ref = 75;
    *ptr = 90;
    ptr = nullptr;`;
  const A = '0x7ffd1000', P = '0x7ffd1008';
  const steps = [
    { line: [], note: 'Memory is a long row of numbered boxes. Each number is an <strong>address</strong>. Nothing has been created yet.', score: null, ref: false, ptr: null },
    { line: 1, note: `<code>score</code> gets a box at address <code>${A}</code> holding 50.`, score: 50, ref: false, ptr: null, hot: 'score' },
    { line: 2, note: '<code>ref</code> is a <strong>reference</strong>: a second name for the same box. No new box holding 50 is made. Whatever you do to ref happens to score.', score: 50, ref: true, ptr: null, hot: 'score' },
    { line: 3, note: `<code>ptr</code> is a <strong>pointer</strong>: its own box, which stores an address. <code>&amp;score</code> means "the address of score", so ptr holds <code>${A}</code>.`, score: 50, ref: true, ptr: A, hot: 'ptr', target: true },
    { line: 4, note: 'Assigning through the reference changes score itself.', score: 75, ref: true, ptr: A, hot: 'score' },
    { line: 5, note: '<code>*ptr</code> <strong>dereferences</strong> the pointer: follow the address and use the box it points at. So score becomes 90.', score: 90, ref: true, ptr: A, hot: 'score', target: true },
    { line: 6, note: '<code>nullptr</code> means "points at nothing". ptr no longer refers to score. score keeps its value.', score: 90, ref: true, ptr: 'nullptr', hot: 'ptr' }
  ];
  host.innerHTML = `
    <div class="btn-row"><button type="button" class="btn small" data-act="back">← Back</button>
      <button type="button" class="btn small primary" data-act="next">Next line →</button>
      <button type="button" class="btn small ghost" data-act="reset">Reset</button><span class="step-count" data-count></span></div>
    <div class="trace-grid"><div data-code></div>
      <div class="stack">
        <div class="viz-status" data-note role="status" aria-live="polite"></div>
        <div class="memory" aria-label="Memory">
          <div class="mem-row mem-head"><span>Address</span><span>Name</span><span>Value</span></div>
          <div class="mem-row" data-row="score"><span class="addr">${A}</span><span><span class="name">score</span> <span class="alias" data-alias></span></span><span class="val" data-val="score"></span></div>
          <div class="mem-row" data-row="ptr"><span class="addr">${P}</span><span class="name">ptr</span><span class="val" data-val="ptr"></span></div>
        </div>
        <div><div class="console-label">Evaluate an expression at this step</div>
          <div class="btn-row" data-exprs>${['score', '&score', 'ref', 'ptr', '*ptr', '&ptr'].map(x => `<button type="button" class="btn small" data-x="${esc(x)}"><code>${esc(x)}</code></button>`).join('')}</div></div>
        <div class="console" data-out role="status" aria-live="polite"></div>
      </div></div>`;
  host.querySelector('[data-code]').innerHTML = codeBlock(code, { file: 'memory.cpp' });
  let i = 0;
  const render = () => {
    const s = steps[i];
    setCodeHighlight(host.querySelector('[data-code] .code'), parseLines(s.line));
    host.querySelector('[data-count]').textContent = `Line ${i} of ${steps.length - 1}`;
    host.querySelector('[data-note]').innerHTML = s.note;
    const rs = host.querySelector('[data-row="score"]'), rp = host.querySelector('[data-row="ptr"]');
    rs.classList.toggle('empty', s.score == null); rp.classList.toggle('empty', s.ptr == null);
    rs.classList.toggle('active', s.hot === 'score'); rp.classList.toggle('active', s.hot === 'ptr');
    rs.classList.toggle('target', !!s.target && s.hot !== 'score');
    host.querySelector('[data-val="score"]').textContent = s.score ?? '—';
    host.querySelector('[data-alias]').textContent = s.ref ? '(also called ref)' : '';
    host.querySelector('[data-val="ptr"]').innerHTML = s.ptr == null ? '—'
      : s.ptr === 'nullptr' ? 'nullptr <span class="field-hint">(points nowhere)</span>' : `${s.ptr} <span class="ptr-arrow">→ score</span>`;
    host.querySelector('[data-out]').innerHTML = '<span class="note">Pick an expression to see its value.</span>';
    host.querySelector('[data-act="back"]').disabled = i === 0;
    host.querySelector('[data-act="next"]').disabled = i === steps.length - 1;
  };
  const evalX = x => {
    const s = steps[i];
    const missing = n => `<span class="err">error: '${n}' was not declared in this scope</span>\n<span class="note">It has not been created yet at this step.</span>`;
    let r;
    switch (x) {
      case 'score': r = s.score == null ? missing('score') : `${s.score}`; break;
      case '&score': r = s.score == null ? missing('score') : `${A}   <span class="note">// the address of score</span>`; break;
      case 'ref': r = !s.ref ? missing('ref') : `${s.score}   <span class="note">// same box as score</span>`; break;
      case 'ptr': r = s.ptr == null ? missing('ptr') : s.ptr === 'nullptr' ? '0   <span class="note">// nullptr prints as 0</span>' : `${A}   <span class="note">// the address stored in ptr</span>`; break;
      case '*ptr': r = s.ptr == null ? missing('ptr') : s.ptr === 'nullptr' ? '<span class="err">Segmentation fault (core dumped)</span>\n<span class="note">Dereferencing nullptr is undefined behaviour. Check if (ptr != nullptr) first.</span>' : `${s.score}   <span class="note">// follow the address to score</span>`; break;
      case '&ptr': r = s.ptr == null ? missing('ptr') : `${P}   <span class="note">// ptr has its own address too</span>`; break;
    }
    host.querySelector('[data-out]').innerHTML = `<span class="in">std::cout &lt;&lt; ${esc(x)};</span>\n${r}`;
  };
  host.querySelector('[data-exprs]').addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) evalX(b.dataset.x); });
  host.querySelector('[data-act="next"]').addEventListener('click', () => { if (i < steps.length - 1) { i++; render(); } });
  host.querySelector('[data-act="back"]').addEventListener('click', () => { if (i > 0) { i--; render(); } });
  host.querySelector('[data-act="reset"]').addEventListener('click', () => { i = 0; render(); });
  render();
};

  host.querySelector('[data-act="create"]').addEventListener('click', () => {
    const name = (host.querySelector('#' + ids.n).value.trim() || 'Player').replace(/"/g, '');
    const health = Math.trunc(Number(host.querySelector('#' + ids.h).value) || 0);
    if (objects.length >= 6) { out.textContent = 'That is plenty of objects for this demo.'; return; }
    objects.push({ name, health });
    const v = varName(objects.length - 1);
    add(`Player ${v};\n${v}.name = "${name}";\n${v}.health = ${health};`);
    out.textContent = `Created ${v}. The same class produced another independent object.`;
    draw();
  });
  host.querySelector('[data-objs]').addEventListener('click', e => {
    const b = e.target.closest('[data-call]');
    if (!b) return;
    const i = Number(b.dataset.i), o = objects[i], v = varName(i);
    if (b.dataset.call === 'show') { add(`${v}.displayHealth();`); out.textContent = `${o.name} has ${o.health} health`; }
    else {
      o.health -= 25; add(`${v}.takeDamage(25);`);
      out.textContent = `${o.name} took 25 damage. Only ${v} changed: each object has its own copy of the attributes.` + (o.health < 0 ? `\nHealth is now ${o.health}. With public attributes nothing stops this. Encapsulation fixes it.` : '');
    }
    draw();
  });
  draw();
};

/* ---------- Class designer (Section 12 activity) ---------- */
Widgets.classDesigner = host => {
  const nameId = uid('cn');
  let attrs = [{ acc: 'private', type: 'std::string', name: 'model' }, { acc: 'private', type: 'int', name: 'speed' }];
  let methods = [{ acc: 'public', type: 'void', name: 'accelerate(int amount)' }, { acc: 'public', type: 'int', name: 'getSpeed()' }];
  host.innerHTML = `
    <div class="field"><label for="${nameId}">Class name</label><input id="${nameId}" type="text" value="Vehicle" style="width:12em"></div>
    <div class="two-col"><div class="stack">
      <div class="console-label">Attributes (data)</div><div class="designer-rows" data-list="attrs"></div>
      <button type="button" class="btn small" data-add="attrs">+ Add attribute</button>
      <div class="console-label">Methods (behaviour)</div><div class="designer-rows" data-list="methods"></div>
      <button type="button" class="btn small" data-add="methods">+ Add method</button></div>
      <div class="stack"><div data-code></div><div class="feedback" data-fb role="status" aria-live="polite"></div></div></div>`;
  const lists = { attrs, methods };
  const types = { attrs: ['int', 'double', 'bool', 'char', 'std::string'], methods: ['void', 'int', 'double', 'bool', 'std::string'] };
  const drawList = key => {
    host.querySelector(`[data-list="${key}"]`).innerHTML = lists[key].map((r, i) => `
      <div class="designer-row">
        <select data-k="${key}" data-i="${i}" data-f="acc" aria-label="Access for row ${i + 1}">${['public', 'private'].map(a => `<option ${a === r.acc ? 'selected' : ''}>${a}</option>`).join('')}</select>
        <select data-k="${key}" data-i="${i}" data-f="type" aria-label="Type for row ${i + 1}">${types[key].map(t => `<option ${t === r.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <input type="text" data-k="${key}" data-i="${i}" data-f="name" value="${esc(r.name)}" aria-label="Name for row ${i + 1}" spellcheck="false">
        <button type="button" class="btn small" data-del="${key}" data-i="${i}" aria-label="Remove row ${i + 1}">✕</button></div>`).join('');
  };
  const gen = () => {
    const cls = host.querySelector('#' + nameId).value.trim() || 'MyClass';
    const lines = [`class ${cls}`, '{'];
    ['private', 'public'].forEach(acc => {
      const a = lists.attrs.filter(r => r.acc === acc), m = lists.methods.filter(r => r.acc === acc);
      if (!a.length && !m.length) return;
      lines.push(`${acc}:`);
      a.forEach(r => lines.push(`    ${r.type} ${r.name || 'unnamed'};`));
      m.forEach(r => {
        const nm = r.name || 'method()';
        lines.push(`    ${r.type} ${nm.includes('(') ? nm : nm + '()'}`, '    {', r.type === 'void' ? '        // TODO' : `        // TODO: return a ${r.type}`, '    }');
      });
    });
    lines.push('};');
    host.querySelector('[data-code]').innerHTML = codeBlock(lines.join('\n'), { file: cls + '.h' });
    const tips = [];
    if (lists.attrs.some(r => r.acc === 'public')) tips.push('Some attributes are public. Encapsulation usually keeps data private and exposes methods instead.');
    if (!lists.methods.some(r => r.acc === 'public')) tips.push('No public methods, so code outside the class cannot use it.');
    if (!/^[A-Z]/.test(cls)) tips.push('Class names conventionally start with a capital letter.');
    if ([...lists.attrs, ...lists.methods].some(r => !/^[A-Za-z_]\w*(\(.*\))?$/.test(r.name.trim()))) tips.push('Check the names: letters, digits and underscores only, no spaces.');
    const fb = host.querySelector('[data-fb]');
    fb.className = 'feedback ' + (tips.length ? 'bad' : 'good');
    fb.innerHTML = tips.length ? `<strong>Design review:</strong><ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>` : '<strong>Good design.</strong> <span>Private data, public methods and a clear name. Copy the code into the task below to extend it.</span>';
  };
  host.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.k) lists[t.dataset.k][t.dataset.i][t.dataset.f] = t.value;
    gen();
  });
  host.addEventListener('click', e => {
    const add = e.target.closest('[data-add]'), del = e.target.closest('[data-del]');
    if (add) { const k = add.dataset.add; lists[k].push({ acc: k === 'attrs' ? 'private' : 'public', type: types[k][0], name: k === 'attrs' ? 'newAttribute' : 'newMethod()' }); drawList(k); gen(); }
    if (del) { lists[del.dataset.del].splice(Number(del.dataset.i), 1); drawList(del.dataset.del); gen(); }
  });
  drawList('attrs'); drawList('methods'); gen();
};

Widgets.hierarchy = host => {
  const classes = {
    Character: { parent: null, members: [['protected', 'name : std::string'], ['protected', 'health : int'], ['public', 'Character(std::string, int)'], ['public', 'takeDamage(int) : void'], ['public', 'isAlive() : bool']] },
    Player: { parent: 'Character', members: [['private', 'score : int'], ['public', 'Player(std::string, int)'], ['public', 'addScore(int) : void']] },
    Enemy: { parent: 'Character', members: [['private', 'damage : int'], ['public', 'Enemy(std::string, int, int)'], ['public', 'attack() : int']] }
  };
  host.innerHTML = `
    <div class="tree" role="group" aria-label="Class hierarchy">
      <button type="button" class="tree-node" data-c="Character" aria-pressed="true">Character</button>
      <span class="tree-caption">base class</span>
      <div class="tree-stem" aria-hidden="true"></div>
      <div class="tree-kids">
        <div class="tree-kid"><button type="button" class="tree-node" data-c="Player" aria-pressed="false">Player</button><span class="tree-caption">derived class</span></div>
        <div class="tree-kid"><button type="button" class="tree-node" data-c="Enemy" aria-pressed="false">Enemy</button><span class="tree-caption">derived class</span></div>
      </div></div>
    <div class="two-col"><div data-uml></div><div class="stack"><div data-access></div></div></div>
    <div class="legend"><span class="chip">Grey members are inherited</span><span class="chip">Constructors are not inherited</span></div>`;
  const tag = a => `<span class="tagp tag-${a.slice(0, 3)}">${a}</span>`;
  const show = c => {
    host.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === c));
    const k = classes[c];
    const own = k.members;
    const inh = k.parent ? classes[k.parent].members.filter(m => !m[1].startsWith(k.parent + '(')) : [];
    host.querySelector('[data-uml]').innerHTML = `
      <div class="uml"><div class="uml-name">${c}<span class="uml-sub">${k.parent ? `: public ${k.parent}` : 'base class'}</span></div>
        ${inh.length ? `<div>${inh.map(m => `<span class="member inherited">${esc(m[1])}${tag(m[0])} <small>from ${k.parent}</small></span>`).join('')}</div>` : ''}
        <div>${own.map(m => `<span class="member">${esc(m[1])}${tag(m[0])}</span>`).join('')}</div></div>`;
    const rows = [...inh.map(m => [m, true]), ...own.map(m => [m, false])].map(([m, inherited]) => {
      const [acc, sig] = m;
      const inClass = inherited ? acc !== 'private' : true;
      const inMain = acc === 'public';
      const yes = '<span style="color:var(--good);font-weight:700">yes</span>', no = '<span style="color:var(--bad);font-weight:700">no</span>';
      return `<tr><td><code>${esc(sig.split(' :')[0])}</code></td><td>${inClass ? yes : no}</td><td>${inMain ? yes : no}</td></tr>`;
    }).join('');
    host.querySelector('[data-access]').innerHTML = `<div class="console-label">Who can use each member of ${c}?</div>
      <div class="table-wrap"><table><thead><tr><th scope="col">Member</th><th scope="col">Inside ${c}</th><th scope="col">From main()</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="field-hint">${c === 'Character' ? '<code>protected</code> members are hidden from main(), but derived classes can use them.' : `${c} can use <code>name</code> and <code>health</code> because they are protected in Character. main() cannot.`}</p>`;
  };
  host.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => show(b.dataset.c)));
  show('Character');
};

/* ---------- Polymorphism demo (Section 15) ---------- */
Widgets.polyDemo = host => {
  const vid = uid('virt');
  host.innerHTML = `
    <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="${vid}" checked style="width:20px;height:20px">
      Mark <code>attack()</code> as <code>virtual</code> in the base class</label>
    <div class="two-col"><div data-code></div>
      <div class="stack"><div class="btn-row"><button type="button" class="btn primary" data-run>Run the loop (simulated)</button></div>
        <div class="console-label">Output</div><div class="console" data-out role="status" aria-live="polite"></div>
        <div class="feedback info" data-fb></div></div></div>`;
  const cb = host.querySelector('#' + vid);
  const draw = () => {
    const v = cb.checked;
    const code = cpp`
      class Character
      {
      public:
          ${v ? 'virtual ' : ''}void attack()
          {
              std::cout << "Character attacks\n";
          }
      };

      class Warrior : public Character
      {
      public:
          void attack()${v ? ' override' : ''}
          {
              std::cout << "Warrior swings a sword\n";
          }
      };

      class Mage : public Character
      {
      public:
          void attack()${v ? ' override' : ''}
          {
              std::cout << "Mage casts a fireball\n";
          }
      };

      int main()
      {
          Warrior w;
          Mage m;
          Character* party[2] = {&w, &m};
          for (Character* c : party)
          {
              c->attack();
          }
      }`;
    host.querySelector('[data-code]').innerHTML = codeBlock(code, { file: 'party.cpp', highlight: [4, 13, 22, 34] });
    host.querySelector('[data-out]').innerHTML = '<span class="note">Press Run.</span>';
    host.querySelector('[data-fb]').innerHTML = v
      ? '<strong>With virtual:</strong> the call is decided at <strong>run time</strong> by the real type of each object. This is runtime polymorphism.'
      : '<strong>Without virtual:</strong> the call is decided at <strong>compile time</strong> by the pointer type, <code>Character*</code>. Both objects run the base version.';
  };
  host.querySelector('[data-run]').addEventListener('click', () => {
    host.querySelector('[data-out]').textContent = cb.checked ? 'Warrior swings a sword\nMage casts a fireball' : 'Character attacks\nCharacter attacks';
  });
  cb.addEventListener('change', draw);
  draw();
};

      {

  };
  host.innerHTML = `
    <div class="viz-controls">
      <div class="field"><label for="${ids.n}">Player name</label><input id="${ids.n}" type="text" value="Alex" maxlength="12" style="width:8em"></div>
      <div class="field"><label for="${ids.s}">Score</label><input id="${ids.s}" type="number" value="100" style="width:6em"></div>

        <button type="button" class="btn ghost" data-del>Delete file</button></div></div>
    <div class="two-col"><div data-code></div>
      <div class="stack"><div class="file-pane"><div class="fp-head">📄 scores.txt (simulated disk)</div><pre data-file></pre></div>
        <div class="console-label">Console</div><div class="console" data-out role="status" aria-live="polite"></div>
        <div class="feedback info" data-fb></div></div></div>`;
  const $ = s => host.querySelector(s);
  const drawFile = () => { $('[data-file]').textContent = file == null ? '(file does not exist)' : file || '(empty file)'; };
  const run = k => {
    const name = ($('#' + ids.n).value.trim() || 'Player').replace(/"/g, '');
    const entry = `${name} ${Math.trunc(Number($('#' + ids.s).value) || 0)}`;
    $('[data-code]').innerHTML = codeBlock(progs[k].code(entry), { file: 'scores.cpp' });
    let out = '', fb = '';
    if (k === 'write') { const had = file != null && file !== ''; file = entry + '\n'; fb = had ? '<strong>The old contents are gone.</strong> Opening with ofstream truncates (empties) the file first.' : 'ofstream created the file and wrote one line.'; }
    if (k === 'append') { const created = file == null; file = (file || '') + entry + '\n'; fb = created ? '<code>std::ios::app</code> created the file because it did not exist.' : '<code>std::ios::app</code> adds to the end and keeps existing lines. Use this for a high-score log.'; }
    if (k === 'read') {
      if (file == null) { out = 'Could not open file'; fb = 'ifstream does not create files. <code>is_open()</code> returned false, so the program printed a message and stopped safely.'; }
      else { out = file || '(nothing printed: the file is empty)'; fb = '<code>std::getline</code> returns false at the end of the file, which ends the while loop.'; }
    }
    $('[data-out]').textContent = out || '(no console output)';
    $('[data-fb]').innerHTML = fb;
    drawFile();
  };
  host.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => run(b.dataset.p)));
  $('[data-del]').addEventListener('click', () => { file = null; drawFile(); $('[data-fb]').textContent = 'The file has been deleted from the simulated disk.'; $('[data-out]').textContent = ''; });
  $('[data-code]').innerHTML = codeBlock(progs.append.code('Alex 100'), { file: 'scores.cpp' });
  $('[data-out]').innerHTML = '<span class="note">Run a program to see what happens.</span>';
  $('[data-fb]').innerHTML = 'Try Read first (no file yet), then Append twice, then Write, and watch the file.';
  drawFile();
};

</script>
  <script>
/* ==========================================================================
   programs.js — prepared C++ programs with simulated behaviour.
   The browser cannot compile C++. Each program below pairs real, compilable
   C++ source with a JavaScript function that reproduces the output a real
   compiler would give for that exact source. Used by the playground and by
   the simulated-console widgets in lessons.
   ========================================================================== */
'use strict';

/* Simulated files persist between runs while the page is open. */
const SimFiles = { 'highscores.txt': 'Alex 120\nSam 95\n' };

const Programs = {
  hello: {
    title: 'Hello World', topic: 'Section 1',
    code: cpp`
      #include <iostream>

      int main()
      {
          std::cout << "Hello World!";
          return 0;
      }`,
    run(io) { io.out('Hello World!'); }
  },

  variables: {
    title: 'Variables and types', topic: 'Section 2',
    code: cpp`
      #include <iostream>
      #include <string>

      int main()
      {
          int age = 21;
          double price = 19.99;
          char grade = 'A';
          bool completed = true;
          std::string name = "Alex";

          std::cout << "Name: " << name << "\n";
          std::cout << "Age: " << age << "\n";
          std::cout << "Price: " << price << "\n";
          std::cout << "Grade: " << grade << "\n";
          std::cout << "Completed: " << completed << "\n";
          return 0;
      }`,
    run(io) { io.out('Name: Alex\nAge: 21\nPrice: 19.99\nGrade: A\nCompleted: 1\n'); }
  },

  input: {
    title: 'Input: greet the user', topic: 'Section 3', stdin: 'Alex',
    code: cpp`
      #include <iostream>
      #include <string>

      int main()
      {
          std::string name;

          std::cout << "Enter your name: ";
          std::cin >> name;

          std::cout << "Hello " << name;

          return 0;
      }`,
    run(io) {
      io.out('Enter your name: ');
      const name = io.word() ?? '';
      io.out('Hello ' + name);
    }
  },

  multiInput: {
    title: 'Input: several values', topic: 'Section 3', stdin: 'Alex\n21\nComputing',
    code: cpp`
      #include <iostream>
      #include <string>

      int main()
      {
          std::string name;
          int age;
          std::string course;

          std::cout << "Enter your name: ";
          std::cin >> name;
          std::cout << "Enter your age: ";
          std::cin >> age;
          std::cout << "Enter your course: ";
          std::cin >> course;

          std::cout << "\nHello " << name << "!" << std::endl;
          std::cout << "In 5 years you will be " << age + 5 << "." << std::endl;
          std::cout << "Good luck with " << course << "." << std::endl;
          return 0;
      }`,
    run(io) {
      io.out('Enter your name: ');
      const name = io.word() ?? '';
      io.out('Enter your age: ');
      let age = io.int();
      const failed = age == null;
      if (failed) age = 0;
      io.out('Enter your course: ');
      const course = failed ? '' : (io.word() ?? '');
      io.out(`\nHello ${name}!\nIn 5 years you will be ${age + 5}.\nGood luck with ${course}.\n`);
      if (failed) io.note('\n[cin failed to read a number for age, so age became 0 and later reads were skipped]');
    }
  },

  operators: {
    title: 'Operators', topic: 'Section 4',
    code: cpp`
      #include <iostream>

      int main()
      {
          int x = 10;
          int y = 4;

          std::cout << "x + y = " << x + y << "\n";
          std::cout << "x - y = " << x - y << "\n";
          std::cout << "x * y = " << x * y << "\n";
          std::cout << "x / y = " << x / y << "\n";
          std::cout << "x % y = " << x % y << "\n";
          std::cout << "x / 4.0 = " << x / 4.0 << "\n";
          std::cout << "x > y is " << (x > y) << "\n";

          x += 5;
          y++;
          std::cout << "After x += 5 and y++: x = " << x << ", y = " << y;
          return 0;
      }`,
    run(io) {
      io.out('x + y = 14\nx - y = 6\nx * y = 40\nx / y = 2\nx % y = 2\nx / 4.0 = 2.5\nx > y is 1\nAfter x += 5 and y++: x = 15, y = 5');
    }
  },

  grading: {
    title: 'Selection: grade a score', topic: 'Section 5', stdin: '65',
    code: cpp`
      #include <iostream>

      int main()
      {
          int score;
          std::cout << "Enter your score (0-100): ";
          std::cin >> score;

          if (score < 0 || score > 100)
          {
              std::cout << "Invalid score";
          }
          else if (score >= 70)
          {
              std::cout << "Distinction";
          }
          else if (score >= 40)
          {
              std::cout << "Pass";
          }
          else
          {
              std::cout << "Fail";
          }
          return 0;
      }`,
    run(io) {
      io.out('Enter your score (0-100): ');
      let s = io.int();
      if (s == null) s = 0;
      io.out(s < 0 || s > 100 ? 'Invalid score' : s >= 70 ? 'Distinction' : s >= 40 ? 'Pass' : 'Fail');
    }
  },

  forLoop: {
    title: 'Loops: count to 10', topic: 'Section 6',
    code: cpp`
      #include <iostream>

      int main()
      {
          for (int i = 1; i <= 10; i++)
          {
              std::cout << i << std::endl;
          }
          return 0;
      }`,
    run(io) { for (let i = 1; i <= 10; i++) io.out(i + '\n'); }
  },

  timesTable: {
    title: 'Loops: times table', topic: 'Section 6', stdin: '7',
    code: cpp`
      #include <iostream>

      int main()
      {
          int n;
          std::cout << "Which times table? ";
          std::cin >> n;

          for (int i = 1; i <= 12; i++)
          {
              std::cout << i << " x " << n << " = " << i * n << "\n";
          }
          return 0;
      }`,
    run(io) {
      io.out('Which times table? ');
      const n = io.int() ?? 0;
      for (let i = 1; i <= 12; i++) io.out(`${i} x ${n} = ${i * n}\n`);
    }
  },

  guessing: {
    title: 'Number guessing game', topic: 'Challenge', stdin: '50\n25\n37\n42',
    code: cpp`
      #include <iostream>

      int main()
      {
          const int secret = 42;   // a real game would pick a random number
          int guess = 0;
          int attempts = 0;

          while (guess != secret)
          {
              std::cout << "Guess a number (1-100): ";
              std::cin >> guess;
              attempts++;

              if (guess < secret)
              {
                  std::cout << "Too low!\n";
              }
              else if (guess > secret)
              {
                  std::cout << "Too high!\n";
              }
          }

          std::cout << "Correct! You took " << attempts << " attempts.";
          return 0;
      }`,
    run(io) {
      let guess = 0, attempts = 0;
      while (guess !== 42) {
        io.out('Guess a number (1-100): ');
        const g = io.int();
        if (g == null) {
          io.note('\n[Simulation stopped: no more input. In a real terminal the program would wait for you to type. If cin had failed, the loop would run forever.]');
          return;
        }
        guess = g; attempts++;
        if (guess < 42) io.out('Too low!\n');
        else if (guess > 42) io.out('Too high!\n');
      }
      io.out(`Correct! You took ${attempts} attempts.`);
    }
  },

  functions: {
    title: 'Functions and overloading', topic: 'Section 7',
    code: cpp`
      #include <iostream>

      int addNumbers(int a, int b);          // declarations
      double addNumbers(double a, double b); // overload
      void printTitle();

      int main()
      {
          printTitle();

      { label: '2. References', html: '<p>A <strong>reference</strong> is another name for an existing variable. It must be set up when it is created and always refers to the same variable afterwards. Anything you do to the reference happens to the original.</p>', blocks: [{ type: 'code', file: 'ref.cpp', code: cpp`

        #include <iostream>
        #include <vector>

        void addBonus(int& score, int bonus)
        {
            score += bonus;
        }

        void halve(int* value)
        {
            if (value == nullptr)
            {
                return;
            }
            *value /= 2;
        }

        void minMax(const std::vector<int>& v, int& low, int& high)
        {
            low = v.at(0);
            high = v.at(0);
            for (int x : v)
            {
                if (x < low) low = x;
                if (x > high) high = x;
            }

  intro: `<p><strong>Polymorphism</strong> means “many forms”. One piece of code, such as <code>member-&gt;attack()</code>, can do different things depending on the actual type of object it is working with. A game loop can tell every character to attack without knowing which are warriors and which are mages.</p>`,

        Character* c1 = &w;   // OK
        Character* c2 = &m;   // OK` }] },
      { label: 'virtual and override', html: '<p>Marking a base method <code>virtual</code> tells C++ to decide at <strong>run time</strong> which version to call, based on the real object. In the derived class, <code>override</code> asks the compiler to check that you really are overriding a virtual function.</p>', blocks: [{ type: 'code', file: 'virtual.cpp', code: cpp`
        class Character
        {
        public:
            virtual void attack() { std::cout << "Basic attack"; }

        {
        public:

      { label: 'Virtual destructor', html: '<p>If a derived object might be deleted through a base pointer, the base class needs a <code>virtual</code> destructor. Otherwise only the base part is destroyed. A rule of thumb: if a class has any virtual function, give it a virtual destructor.</p>', blocks: [{ type: 'code', file: 'vdtor.cpp', code: cpp`

    { type: 'debug', title: 'The override that is not', prompt: 'The compiler rejects this program.', code: cpp`
      class Shape
      {
      public:
          virtual double area() { return 0; }

  challenge: [
    { type: 'task', title: 'Shape calculator', level: 'Advanced', prompt: '<p>Create an abstract <code>Shape</code> class with pure virtual <code>area()</code> and <code>name()</code>, and a virtual destructor. Derive <code>Circle</code>, <code>Rectangle</code> and <code>Triangle</code>. Store pointers to one of each in a <code>std::vector&lt;Shape*&gt;</code>, then print each name and area and the total area in a single loop.</p>',
      output: 'Circle: 12.5664\nRectangle: 12\nTriangle: 6\nTotal: 30.5664',
      hints: ['<code>virtual std::string name() = 0;</code>', 'Create the objects normally in main, then push their addresses: <code>shapes.push_back(&amp;circle);</code>'],
      solution: cpp`
        #include <iostream>
        #include <string>
        #include <vector>

        class Shape
        {
        public:
            virtual ~Shape() {}
            virtual double area() = 0;
            virtual std::string name() = 0;
        };

        class Circle : public Shape
        {
            double r;
        public:
            Circle(double radius) : r(radius) {}
            double area() override { return 3.14159265 * r * r; }
            std::string name() override { return "Circle"; }
        };

        class Rectangle : public Shape
        {
            double w, h;
        public:
            Rectangle(double width, double height) : w(width), h(height) {}
            double area() override { return w * h; }
            std::string name() override { return "Rectangle"; }
        };

        class Triangle : public Shape
        {
            double b, h;
        public:
            Triangle(double base, double height) : b(base), h(height) {}
            double area() override { return 0.5 * b * h; }
            std::string name() override { return "Triangle"; }
        };

        int main()
        {
            Circle c(2);
            Rectangle r(3, 4);
            Triangle t(3, 4);
            std::vector<Shape*> shapes = {&c, &r, &t};

            double total = 0;
            for (Shape* s : shapes)
            {
                std::cout << s->name() << ": " << s->area() << "\n";
                total += s->area();
            }
            std::cout << "Total: " << total << "\n";
            return 0;
        }` }

                entries.push_back(e);
            }
            return entries;   // empty if the file did not exist
        }

        int main()
        {
            std::string name;
            int score;
            std::cout << "Name: ";
            std::cin >> name;
            std::cout << "Score: ";
            std::cin >> score;

            saveScore(name, score);
            std::vector<Entry> all = loadScores();
            std::sort(all.begin(), all.end(),
                      [](const Entry& a, const Entry& b) { return a.score > b.score; });

            std::cout << "--- Top scores ---\n";
            for (std::size_t i = 0; i < all.size() && i < 5; i++)
            {
                std::cout << i + 1 << ". " << all[i].name << " " << all[i].score << "\n";
            }
            return 0;
        }`, playground: 'files', solutionNote: 'The playground has a simpler version (without sorting) that you can run repeatedly to watch the simulated file grow.' }
  ],
  mistakes: [
    { title: 'Not checking the file opened', wrong: 'std::ifstream in("data.txt");\nin >> x;', right: 'std::ifstream in("data.txt");\nif (!in.is_open()) { /* handle it */ }\nin >> x;', why: 'Reads from a stream that failed to open silently do nothing, leaving variables unchanged.' },
    { title: 'Overwriting instead of appending', wrong: 'std::ofstream out("log.txt");', right: 'std::ofstream out("log.txt", std::ios::app);', why: 'The default mode empties the file every time it is opened.' },
    { title: 'Using >> for lines with spaces', wrong: 'in >> title;   // "The Last Level"', right: 'std::getline(in, title);', why: '>> stops at the first space, the same as with cin.' },
    { title: 'Testing eof() before reading', wrong: 'while (!in.eof())\n{\n    in >> x;\n    total += x;\n}', right: 'while (in >> x)\n{\n    total += x;\n}', why: 'eof() only becomes true after a read fails, so the last value is processed twice.' }
  ],
  check: [
    { type: 'mcq', q: 'Which class writes to a file?', options: [['std::ifstream', 'The i stands for input (reading).'], 'std::ofstream', ['std::cout', 'cout writes to the console.'], ['std::filewriter', 'Not a standard class.']], answer: 1, explain: 'o for output.' },
    { type: 'mcq', q: 'What happens when you open an existing file with <code>std::ofstream out("data.txt");</code>?', options: [['New output is added to the end', 'That needs std::ios::app.'], 'The existing contents are erased', ['The program fails with an error', 'Opening succeeds.'], ['The file is opened read-only', 'ofstream is for writing.']], answer: 1, explain: 'The default mode truncates the file.' },
    { type: 'mcq', q: 'Which loop reads every line of a file correctly?', options: [['while (!in.eof()) { getline(in, line); ... }', 'This processes a final empty or repeated line.'], 'while (std::getline(in, line)) { ... }', ['for (line : in) { ... }', 'Streams cannot be used like this.']], answer: 1, explain: 'getline returns a stream that converts to false when reading fails.' }
  ],
  keypoints: [
    'Include <code>&lt;fstream&gt;</code>. Write with <code>std::ofstream</code>, read with <code>std::ifstream</code>.',
    'File streams use <code>&lt;&lt;</code>, <code>&gt;&gt;</code> and <code>getline</code> like cin and cout.',
    'ofstream empties the file by default; use <code>std::ios::app</code> to append.',
    'Always check <code>is_open()</code>.',
    'Loop with <code>while (in &gt;&gt; x)</code> or <code>while (std::getline(in, line))</code>.',
    'Streams close automatically when destroyed, but <code>close()</code> makes it explicit.'
  ]
});
