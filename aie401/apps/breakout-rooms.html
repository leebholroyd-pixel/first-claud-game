<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout Room Companion, AIE401 Workshop 1</title>
<meta name="description" content="Interactive task cards, timers and role spinner for the three AIE401 Workshop 1 breakout rooms.">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js"></script>
</head>
<body>
<main id="main" class="wrap" tabindex="-1">
  <section class="hero">
    <span class="kicker">Breakout Room Companion</span>
    <h1>Your room, your task, your timer</h1>
    <p>Pick your breakout, spin for roles, then work through each step with its own timer. Keep this open on one screen and the AI tool on the other.</p>
  </section>

  <div class="tabs" role="tablist" aria-label="Breakouts" id="tabs"></div>
  <div id="panel" role="tabpanel" tabindex="-1"></div>
</main>

<script>
AIE.header("Breakout Room Companion");

const ROLES = [
  ["Prompter", "Shares screen and types into the AI tool"],
  ["Critic", "Tests the output against the critique checklist"],
  ["Subject expert", "Judges accuracy and level for real learners"],
  ["Reporter", "Captures the outputs and posts them in Teams"]
];

const CARDS = [
  {
    id: "relay", short: "1. Prompt Relay", title: "Prompt Relay", when: "Breakout one, planning and content creation", mins: 22,
    aim: "Build one real teaching resource for a topic someone in your room is teaching soon. Start from a deliberately weak prompt and improve it in rounds. Roles rotate each round so everybody drives the tool once.",
    steps: [
      ["Pick the topic", 2, "Choose a topic one of you is teaching soon. That person stays as subject expert for every round."],
      ["Round one, the weak prompt", 4, "Type exactly the weak prompt below. Read the output together and agree three things wrong with it.", "Make me a lesson plan on [your topic]."],
      ["Round two, build it properly", 6, "Rewrite the prompt using Context, Role, Task, Format and Checks. Ask for one specific resource, such as a starter activity, a worked example or questions at three levels.", "I teach [who your learners are, level, what they already know]. Act as an experienced [subject] teacher. Create [one specific resource] on [topic]. Format it as [layout and length]. Use British English, explain any jargon, and do not invent facts, statistics or references."],
      ["Round three, critique and refine", 6, "The Critic runs the checklist. Refine at least twice, telling the tool exactly what to change.", "That is too [long, hard, generic]. Rewrite it so that [specific change]. Keep everything else the same."],
      ["Verify and post", 4, "The subject expert decides: use it, change it or bin it. The Reporter posts the weak prompt, the final prompt and one sentence on what made the difference."]
    ],
    stretch: "Ask the tool to critique its own resource as a sceptical head of department, then decide whether its critique was any good.",
    talk: ["What changed when you told it about your learners?", "What would you never use without checking, and how would you check it?", "Did it save time, improve the learning, or both?"],
    extra: "checklist"
  },
  {
    id: "mark", short: "2. Mark the Machine", title: "Mark the Machine", when: "Breakout two, assessment and feedback", mins: 22,
    aim: "Mark a short fictional learner answer yourselves first, then ask the AI tool to mark it, write feedback and build a rubric. Compare. Where do human judgement and the machine part company?",
    steps: [
      ["Mark it yourself first", 5, "On your own, no AI. Decide weak, sound or strong against each criterion and write two sentences of feedback."],
      ["Compare your human marks", 3, "Quick round of the room. Where did you agree and disagree?"],
      ["Ask the machine", 6, "Paste in the task, the answer and the criteria, then use the prompt below. Then ask it to build a fuller rubric with descriptors at three levels.", "Here is an assessment task, a learner's answer and three marking criteria. Judge the answer as weak, sound or strong against each criterion, explain why, and write feedback addressed to the learner that tells them exactly what to improve."],
      ["Compare", 5, "Did it spot what you spotted? Did it miss anything? Could a learner act on its feedback?"],
      ["Agree three rules", 3, "As a room, write three rules for using AI in your own marking and feedback. Post them in Teams."]
    ],
    stretch: "Ask the tool to rewrite its feedback for a learner who is anxious about grades, then for one who is overconfident. Which would you send?",
    talk: ["Did the AI find the factual error? What if nobody had checked?", "Whose feedback would the learner act on, and why?", "Where must the judgement stay with you?"],
    extra: "marking"
  },
  {
    id: "five", short: "3. One Resource, Five Learners", title: "One Resource, Five Learners", when: "Breakout three, inclusion and personalisation", mins: 19,
    aim: "Use AI to adapt one short piece of teaching material for two of five fictional learners. Then check whether the adaptation is genuinely better for that learner, whether the meaning survived, and what you would never leave to the tool.",
    steps: [
      ["Choose two learners", 1, "Spin or pick two whose needs are very different."],
      ["Adapt", 8, "Ask the AI tool to adapt the source text for each learner in turn. Describe the learner, not just a reading level.", "Adapt the text below for a learner who [describe the learner]. Keep the meaning accurate. Explain what you changed and why."],
      ["Check the meaning", 4, "Read each version against the original. Has anything been lost, softened or got wrong?"],
      ["Check accessibility", 3, "Would it work with a screen reader? Is the reading level right? Run the Accessibility Checker if it is in Word or PowerPoint."],
      ["Decide", 3, "Agree one thing AI did well and one decision you would never leave to the tool. Post both in Teams."]
    ],
    stretch: "Ask the tool to turn the text into a short scenario with three questions at different levels, then judge whether they really are at different levels.",
    talk: ["Is this personalisation, or just a different reading level?", "Who should decide what adjustments a learner receives?", "What would the learner themselves say about this version?"],
    extra: "personas"
  }
];

const CHECKLIST = [
  ["Accuracy", "Is every fact right? Are any references, statistics or quotes made up?"],
  ["Level", "Is it pitched at my learners, not a generic learner?"],
  ["Pedagogy", "Does it actually help learning, or does it just look finished?"],
  ["Inclusion", "Does it work for every learner in my group?"],
  ["Accessibility", "Would it work with a screen reader? Is the language clear?"],
  ["Bias", "Does it rely on stereotypes or narrow examples?"],
  ["Ownership", "Have I added my own judgement, examples and voice?"]
];

const ANSWER = `Cyber security matters to small businesses because they hold customer data like names, addresses and card details, and they usually do not have an IT department to protect it. If a small business is attacked it can lose money, lose its customers' trust and even be fined if personal data is leaked. A local florist I know lost two days of orders when ransomware locked their computer and they had no backup.

The first measure I would recommend is two factor authentication, which means each user has two different passwords for the same account so a hacker has to guess both. The second measure is regular backups kept somewhere separate from the main computer, because then ransomware cannot hold the business to ransom. Backups are cheap and would have saved the florist both days of orders.`;

const PERSONAS = [
  ["Amira", "#008da5", "Learning English as an additional language, around B1. Strong subject understanding in her first language, slowed down by dense English."],
  ["Jordan", "#57b29f", "Dyslexic. Understands quickly when it is talked through, struggles with long blocks of text and unfamiliar terms."],
  ["Sam", "#003e66", "Highly able and easily bored. Finishes early and wants something that stretches them."],
  ["Priya", "#004451", "Blind, uses a screen reader. Images without alt text and tables laid out for the eye are lost to her."],
  ["Callum", "#5b6f7a", "Returning adult learner who works nights. Low confidence with technology, needs to see why it matters to him."]
];

const SOURCE = `What is phishing?
Phishing is a form of social engineering in which an attacker impersonates a trusted organisation, typically via email or SMS, to manipulate the recipient into disclosing credentials, financial information or other sensitive data, or into executing a malicious attachment. Indicators include a sense of urgency, generic salutations, mismatched sender domains and hyperlinks whose destination differs from the displayed text. Users should verify requests through an independent channel rather than responding directly, and should report suspected phishing to their IT or security team so that others can be warned.`;

let current = AIE.get("br-card", 0);
const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");

function renderTabs() {
  tabs.innerHTML = CARDS.map((c, i) => `<button class="tab" role="tab" id="tab-${i}" aria-selected="${i === current}" aria-controls="panel" data-i="${i}">${c.short}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = +b.dataset.i; AIE.set("br-card", current); renderTabs(); render(); panel.focus(); });
}

function render() {
  const c = CARDS[current];
  const done = AIE.get("br-done-" + c.id, []);
  const names = AIE.get("br-names", "");
  panel.setAttribute("aria-labelledby", "tab-" + current);
  panel.innerHTML = `
  <div class="grid g2" style="align-items:start">
    <div>
      <span class="pill">${c.when}</span>
      <h2 style="margin-top:.4em">${c.title}</h2>
      <p>${c.aim}</p>
      <div class="card accent"><strong>Ground rule.</strong> No real learner work, learner names or personal data go into any AI tool. Everything here is fictional or your own material.</div>
    </div>
    <div class="card" style="text-align:center">
      <span class="pill">Room timer, ${c.mins} minutes</span>
      <div class="timer" id="room-timer" aria-live="off">${c.mins}:00</div>
      <div class="bar" aria-hidden="true"><span id="room-bar"></span></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn" id="rt-start">Start</button><button class="btn ghost" id="rt-pause">Pause</button><button class="btn ghost" id="rt-reset">Reset</button>
      </div>
      <p class="small muted" style="margin:10px 0 0" id="rt-msg">The organiser also runs a room timer in Teams.</p>
    </div>
  </div>

  <h2>Roles</h2>
  <div class="card">
    <label class="field" for="names" style="margin-top:0">Who is in your room? First names, separated by commas</label>
    <input class="input" id="names" value="${AIE.esc(names)}" placeholder="e.g. Sam, Ola, Jo, Priti">
    <div class="row" style="margin-top:12px"><button class="btn teal" id="spin">Spin for roles</button><button class="btn ghost" id="rotate">Rotate roles</button></div>
    <div class="grid g4" id="roles" style="margin-top:16px" aria-live="polite"></div>
  </div>

  <h2>Steps</h2>
  <p class="muted">Tick each step as you finish it. Use a step timer if your room tends to run over.</p>
  <ol class="steps" id="steps">${c.steps.map((s, i) => `
    <li class="step ${done.includes(i) ? "done" : ""}" id="st-${i}">
      <span class="num" aria-hidden="true">${i + 1}</span>
      <div><strong>${s[0]}</strong><br><span>${s[2]}</span>
        ${s[3] ? `<div class="copybox" style="margin-top:10px">${AIE.esc(s[3])}</div><button class="btn small ghost" style="margin-top:8px" data-copy="${i}">Copy this prompt</button>` : ""}
        <div class="row" style="margin-top:10px">
          <label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" data-done="${i}" ${done.includes(i) ? "checked" : ""}> Done</label>
          <button class="btn small ghost" data-steptimer="${i}">Start ${s[1]} minute timer</button>
        </div>
      </div>
      <span class="mins">${s[1]} min</span>
    </li>`).join("")}
  </ol>

  <div id="extra"></div>

  <h2>Stretch task</h2>
  <div class="card soft"><p style="margin:0">${c.stretch}</p></div>

  <h2>Talk about</h2>
  <div class="grid g3">${c.talk.map(t => `<div class="card"><strong>${t}</strong></div>`).join("")}</div>

  <h2>Room notes</h2>
  <div class="card">
    <label class="field" for="notes" style="margin-top:0">Capture your outputs here, then copy them into the Breakout outputs channel</label>
    <textarea id="notes" rows="6">${AIE.esc(AIE.get("br-notes-" + c.id, ""))}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn" id="copy-notes">Copy for Teams</button><span class="small muted">Saved automatically in this browser.</span></div>
  </div>`;

  // timer
  const T = AIE.timer(document.getElementById("room-timer"), document.getElementById("room-bar"), () => { document.getElementById("rt-msg").textContent = "Time is up. Head back to the main room."; AIE.toast("Time is up"); });
  T.set(c.mins * 60);
  document.getElementById("rt-start").onclick = () => T.start();
  document.getElementById("rt-pause").onclick = () => T.stop();
  document.getElementById("rt-reset").onclick = () => T.reset();
  panel.querySelectorAll("[data-steptimer]").forEach(b => b.onclick = () => {
    const s = c.steps[+b.dataset.steptimer]; T.set(s[1] * 60); T.start();
    panel.querySelectorAll(".step").forEach(x => x.classList.remove("active")); document.getElementById("st-" + b.dataset.steptimer).classList.add("active");
    document.getElementById("rt-msg").textContent = "Step timer: " + s[0]; window.scrollTo({ top: 0, behavior: "smooth" });
  });
  panel.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => AIE.copy(c.steps[+b.dataset.copy][3], "Prompt copied"));
  panel.querySelectorAll("[data-done]").forEach(cb => cb.onchange = () => {
    let d = AIE.get("br-done-" + c.id, []); const i = +cb.dataset.done;
    d = cb.checked ? [...new Set([...d, i])] : d.filter(x => x !== i); AIE.set("br-done-" + c.id, d);
    document.getElementById("st-" + i).classList.toggle("done", cb.checked);
    if (d.length === c.steps.length) { AIE.confetti(); AIE.toast("All steps done. Nice work."); }
  });

  // roles
  let order = AIE.get("br-order", null);
  const rolesEl = document.getElementById("roles");
  function paintRoles() {
    const n = AIE.get("br-names", "").split(",").map(s => s.trim()).filter(Boolean);
    if (!n.length || !order) { rolesEl.innerHTML = ROLES.map(r => `<div class="card soft"><strong>${r[0]}</strong><br><span class="small">${r[1]}</span></div>`).join(""); return; }
    rolesEl.innerHTML = ROLES.map((r, i) => { const who = order.map((ni, k) => [ni, k]).filter(o => o[1] % ROLES.length === i).map(o => n[o[0]]).filter(Boolean);
      return `<div class="card ${i % 2 ? "accent" : "soft"}"><strong>${r[0]}</strong><div style="font-size:1.3rem;font-weight:800;color:var(--primary)">${who.length ? AIE.esc(who.join(" and ")) : "Nobody yet"}</div><span class="small">${r[1]}</span></div>`; }).join("");
  }
  // order holds indices of names mapped to role slots
  document.getElementById("names").oninput = e => AIE.set("br-names", e.target.value);
  document.getElementById("spin").onclick = () => {
    const n = AIE.get("br-names", "").split(",").map(s => s.trim()).filter(Boolean);
    if (n.length < 2) { AIE.toast("Add at least two names first"); return; }
    let spins = 0; const iv = setInterval(() => { order = AIE.shuffle(n.map((_, i) => i)); paintRoles(); if (++spins > 10) { clearInterval(iv); AIE.set("br-order", order); AIE.toast("Roles assigned"); } }, 90);
  };
  document.getElementById("rotate").onclick = () => { if (!order) { AIE.toast("Spin first"); return; } order = [order[order.length - 1], ...order.slice(0, -1)]; AIE.set("br-order", order); paintRoles(); AIE.toast("Roles rotated"); };
  paintRoles();

  // extras
  const ex = document.getElementById("extra");
  if (c.extra === "checklist") {
    ex.innerHTML = `<h2>Critique checklist</h2><div class="card">${CHECKLIST.map((k, i) => `<label class="check"><input type="checkbox" data-ck="${i}"><span><strong>${k[0]}.</strong> ${k[1]}</span></label>`).join("")}<p class="small muted" style="margin:12px 0 0" id="ck-score">0 of 7 checked</p></div>`;
    ex.querySelectorAll("[data-ck]").forEach(cb => cb.onchange = () => { const n = ex.querySelectorAll("[data-ck]:checked").length; document.getElementById("ck-score").textContent = `${n} of 7 checked` + (n === 7 ? ". Ready for the subject expert." : ""); });
  }
  if (c.extra === "marking") {
    ex.innerHTML = `<h2>The materials</h2>
    <div class="card"><span class="pill">The task</span><p style="margin-top:10px"><strong>Explain why cyber security matters to a small business and recommend two practical measures it should take. Write about 150 words.</strong></p>
    <span class="pill">The learner's answer, fictional</span><div class="copybox" style="margin-top:10px">${AIE.esc(ANSWER)}</div>
    <div class="row" style="margin-top:10px"><button class="btn small ghost" id="cp-ans">Copy task, answer and criteria</button></div>
    <h3 style="margin-top:18px">Marking criteria</h3>
    <table class="tbl"><thead><tr><th>Criterion</th><th>A strong answer</th><th>Your mark</th></tr></thead><tbody>
    ${[["Explains why it matters", "Clear, accurate reasons specific to small businesses"], ["Recommends two measures", "Names two practical measures and describes each accurately"], ["Justifies the recommendations", "Links each measure to a risk the business actually faces"]].map((r, i) => `<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td><select aria-label="Your mark for ${r[0]}" data-mk="${i}"><option value="">Choose</option><option>Weak</option><option>Sound</option><option>Strong</option></select></td></tr>`).join("")}
    </tbody></table>
    <button class="btn teal" style="margin-top:16px" id="reveal">Reveal what to look for</button>
    <div id="rev" hidden class="fb mid"><strong>What to look for, after you have compared</strong>There is one clear factual error: two factor authentication is not two passwords. It combines two different kinds of evidence, such as a password plus a code from a phone. The answer also has a genuine strength: a specific, local example that is used again to justify the backup recommendation. Did your marks, and the machine's, notice both?</div></div>`;
    document.getElementById("cp-ans").onclick = () => AIE.copy("Task: Explain why cyber security matters to a small business and recommend two practical measures it should take. Write about 150 words.\n\nLearner answer:\n" + ANSWER + "\n\nCriteria:\n1. Explains why it matters: clear, accurate reasons specific to small businesses\n2. Recommends two measures: names two practical measures and describes each accurately\n3. Justifies the recommendations: links each measure to a risk the business actually faces", "Task, answer and criteria copied");
    document.getElementById("reveal").onclick = () => { const marked = [...ex.querySelectorAll("[data-mk]")].every(s => s.value); if (!marked && !confirm("Mark it yourselves first? Reveal anyway?")) return; document.getElementById("rev").hidden = false; };
  }
  if (c.extra === "personas") {
    ex.innerHTML = `<h2>The source text</h2><div class="card"><div class="copybox">${AIE.esc(SOURCE)}</div><button class="btn small ghost" style="margin-top:10px" id="cp-src">Copy source text</button></div>
    <h2>The learners, fictional</h2><div class="row" style="margin-bottom:12px"><button class="btn teal" id="pick2">Pick two at random</button></div>
    <div class="grid g3" id="pers">${PERSONAS.map((p, i) => `<div class="card persona" id="pp-${i}"><span class="avatar" style="background:${p[1]}" aria-hidden="true">${p[0][0]}</span><div><strong>${p[0]}</strong><br><span class="small">${p[2]}</span><br><button class="btn small ghost" style="margin-top:8px" data-pp="${i}">Copy adapt prompt</button></div></div>`).join("")}</div>`;
    document.getElementById("cp-src").onclick = () => AIE.copy(SOURCE, "Source text copied");
    ex.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => { const p = PERSONAS[+b.dataset.pp]; AIE.copy(`Adapt the text below for a learner who is ${p[2].charAt(0).toLowerCase() + p[2].slice(1)} Keep the meaning accurate. Explain what you changed and why.\n\n${SOURCE}`, "Prompt for " + p[0] + " copied"); });
    document.getElementById("pick2").onclick = () => { const pick = AIE.shuffle([0, 1, 2, 3, 4]).slice(0, 2); PERSONAS.forEach((_, i) => { const el = document.getElementById("pp-" + i); el.style.outline = pick.includes(i) ? "3px solid var(--teal)" : "none"; el.style.opacity = pick.includes(i) ? 1 : .55; }); AIE.toast("Your learners: " + pick.map(i => PERSONAS[i][0]).join(" and ")); };
  }

  // notes
  const notes = document.getElementById("notes");
  notes.oninput = () => AIE.set("br-notes-" + c.id, notes.value);
  document.getElementById("copy-notes").onclick = () => AIE.copy(`${c.title}, room outputs\n\n${notes.value}`, "Notes copied, paste into Teams");
}
renderTabs(); render();
AIE.footer();
</script>
</body>
</html>
