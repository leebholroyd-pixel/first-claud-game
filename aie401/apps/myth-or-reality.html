<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myth or Reality, AIE401 Workshop 1</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js"></script>
<style>
.statement { font-size: clamp(1.25rem, 3vw, 1.7rem); font-weight: 800; color: var(--primary); min-height: 3.2em; display: flex; align-items: center; }
.mr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mr button { font: inherit; font-weight: 800; font-size: 1.15rem; padding: 22px; border-radius: 16px; border: 0; cursor: pointer; color: #fff; }
.mr .m { background: var(--navy); } .mr .r { background: var(--teal); color: #05241e; }
.mr button:disabled { opacity: .5; cursor: default; }
.mr button.sel { opacity: 1; box-shadow: 0 0 0 4px var(--focus-bg); }
</style>
</head>
<body>
<main id="main" class="wrap" tabindex="-1" style="max-width:860px">
  <section class="hero">
    <span class="kicker">Quick fire, about 6 minutes</span>
    <h1>Myth or Reality?</h1>
    <p>Twelve things people say about AI. Decide fast. Keyboard players can press M for myth and R for reality.</p>
  </section>
  <div class="card" id="game" style="margin-top:22px" aria-live="polite"></div>
</main>
<script>
AIE.header("Myth or Reality?");
const Q = [
  ["Generative AI looks the answer up in a database before it replies.", false, "A language model generates text by predicting likely next words from patterns it learned in training. Some tools are also connected to search or your documents, but the model itself is not looking anything up."],
  ["AI tools can produce references to books and articles that do not exist.", true, "Invented references are one of the best known failures. Always check a reference in a library catalogue or database before you use it."],
  ["If an AI answer sounds confident, it is more likely to be correct.", false, "Confidence is a writing style, not evidence. AI tools sound just as sure when they are wrong."],
  ["The same prompt can give a different answer each time.", true, "Most tools introduce some randomness, which is why you should never treat one answer as the answer."],
  ["AI writing detectors can reliably prove that a learner used AI.", false, "Detectors produce false positives and false negatives, and can be unfair to some groups of writers. They are not proof, and Workshop 2 returns to this."],
  ["Adding context about your learners usually improves the output.", true, "Context is the single biggest lever you have. Level, prior knowledge and needs all change what comes back."],
  ["Anything you type into a free public chatbot stays private.", false, "Depending on the tool and its terms, what you type may be stored, reviewed or used to improve the service. That is why learner data only goes into approved tools."],
  ["AI output can reflect biases in the data it learned from.", true, "Models learn from human produced data, including its stereotypes and gaps. Check examples, names and scenarios for narrowness."],
  ["AI tools always know about events from this week.", false, "Models learn from data up to a point in time. Unless a tool is connected to search, it may not know about recent events, and it may not tell you so."],
  ["You can ask an AI to critique and improve its own answer.", true, "This often helps, but its critique can be wrong too. You are still the final judge."],
  ["Using AI to draft a resource removes the need to check it.", false, "A draft is a draft. Accuracy, level and suitability for your learners are your responsibility."],
  ["AI can help make resources more accessible, for example by simplifying language.", true, "Simplifying, chunking, translating and changing the mode can all widen access, as long as you check the meaning survives."]
];
let order, i, score, lock;
const g = document.getElementById("game");
function start() { order = AIE.shuffle(Q); i = 0; score = 0; ask(); }
function ask() {
  lock = false; const q = order[i];
  g.innerHTML = `<div class="row" style="justify-content:space-between"><span class="pill">${i + 1} of ${order.length}</span><span class="badge">Score ${score}</span></div>
  <div class="bar" style="margin:14px 0" aria-hidden="true"><span style="width:${i / order.length * 100}%"></span></div>
  <p class="statement">${q[0]}</p>
  <div class="mr"><button class="m" id="bm">Myth</button><button class="r" id="br">Reality</button></div><div id="fb"></div>`;
  document.getElementById("bm").onclick = () => ans(false); document.getElementById("br").onclick = () => ans(true);
  document.getElementById("bm").focus();
}
function ans(v) {
  if (lock) return; lock = true; const q = order[i], ok = v === q[1]; if (ok) score++;
  const bm = document.getElementById("bm"), br = document.getElementById("br"); bm.disabled = br.disabled = true; (v ? br : bm).classList.add("sel");
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><strong>${ok ? "Correct" : "Not this time"}, it is ${q[1] ? "reality" : "a myth"}.</strong>${q[2]}</div><button class="btn" style="margin-top:12px" id="nx">${i + 1 < order.length ? "Next" : "See your score"}</button>`;
  document.getElementById("nx").onclick = next; document.getElementById("nx").focus();
}
function next() { i++; i < order.length ? ask() : end(); }
function end() {
  if (score >= 10) AIE.confetti(); AIE.set("mr-best", Math.max(AIE.get("mr-best", 0), score));
  g.innerHTML = `<span class="pill">Finished</span><div class="score" style="margin-top:10px">${score} / ${order.length}</div><p><strong>${score >= 11 ? "Myth buster." : score >= 8 ? "Well informed. A couple of these catch most people out." : "Lots of people believe these. Now you can help them stop."}</strong></p><button class="btn" id="again">Play again</button>`;
  document.getElementById("again").onclick = start;
}
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return; const k = e.key.toLowerCase(); if (!lock && (k === "m" || k === "r") && document.getElementById("bm")) ans(k === "r"); });
start();
AIE.footer();
</script>
</body>
</html>
