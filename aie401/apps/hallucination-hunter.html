<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallucination Hunter, AIE401 Workshop 1</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site.js"></script>
<style>
.sent { display: inline; font: inherit; color: inherit; background: none; border: 0; padding: 2px 3px; margin: 0; cursor: pointer; text-align: left; line-height: 1.9; border-radius: 4px; }
.sent:hover:not(:disabled) { background: var(--accent-soft); }
.sent.right { background: var(--ok-soft); outline: 2px solid var(--ok); }
.sent.wrong { background: var(--no-soft); text-decoration: line-through; }
.sent:disabled { cursor: default; }
.aibox { background: var(--surface-2); border-radius: var(--radius); padding: 20px 22px; font-size: 1.05rem; }
.aibox .who { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.dot { width: 30px; height: 30px; border-radius: 50%; background: var(--cyan); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
.lives { font-size: 1.3rem; letter-spacing: 2px; }
</style>
</head>
<body>
<main id="main" class="wrap" tabindex="-1">
  <section class="hero">
    <span class="kicker">Game, about 10 minutes</span>
    <h1>Hallucination Hunter</h1>
    <p>Each answer below came from an imaginary AI assistant. All but one sentence is accurate. Find the sentence that is confidently, fluently wrong. You have two guesses per round.</p>
  </section>
  <div class="card" id="game" style="margin-top:22px" aria-live="polite"></div>
</main>
<script>
AIE.header("Hallucination Hunter");
const ROUNDS = [
  { q: "Tell me about Blackpool Tower.", s: [
    "Blackpool Tower opened to the public in 1894.",
    "Its design was inspired by the Eiffel Tower in Paris.",
    "It stands at around 158 metres tall.",
    "The tower was designed by Gustave Eiffel himself, who travelled to Blackpool for the opening.",
    "Today it houses attractions including the famous Tower Ballroom."], bad: 3,
    why: "Blackpool Tower was inspired by the Eiffel Tower, but Eiffel did not design it. The tool took a true connection and stretched it into a false one, which is a very common pattern.",
    flag: "A true fact stretched one step too far" },
  { q: "Explain photosynthesis for a Year 9 class.", s: [
    "Photosynthesis is how plants use light energy to make glucose from carbon dioxide and water.",
    "It takes place mainly in the chloroplasts of leaf cells.",
    "Oxygen is released as a by product.",
    "The process was first fully explained by Charles Darwin in On the Origin of Species in 1859.",
    "Chlorophyll absorbs mostly red and blue light, which is why leaves look green."], bad: 3,
    why: "Darwin's famous book is about evolution by natural selection, not photosynthesis. Pairing a real person, a real book and a real date makes an invented claim look authoritative.",
    flag: "Real names and dates attached to the wrong claim" },
  { q: "Work out whether we have enough laptops for group work.", s: [
    "A class of 24 learners split into groups of 4 gives 6 groups.",
    "If each group needs 3 laptops, the class needs 18 laptops.",
    "The room has 20 laptops, so there are 2 spare.",
    "If 25 per cent of the laptops are booked elsewhere, 4 laptops are unavailable.",
    "That leaves fewer laptops than the class needs."], bad: 3,
    why: "25 per cent of 20 is 5, not 4. Generative AI predicts text rather than calculating, so arithmetic in the middle of a fluent answer is worth checking, even when the conclusion happens to look sensible.",
    flag: "Arithmetic inside fluent prose" },
  { q: "Give learners some basic cyber security advice.", s: [
    "Phishing messages often create a false sense of urgency.",
    "Two factor authentication means using two different passwords for the same account.",
    "Regular backups kept separately can reduce the impact of ransomware.",
    "Software updates often fix known security weaknesses.",
    "Suspected phishing should be reported to the IT or security team."], bad: 1,
    why: "Two factor authentication combines two different kinds of evidence, such as a password and a code from your phone. Two passwords are still one factor. This is the same error hidden in the Mark the Machine learner answer.",
    flag: "A plausible definition that is subtly wrong" },
  { q: "Summarise the current picture on AI in education.", s: [
    "UNESCO published guidance on generative AI in education and research in 2023.",
    "That guidance calls for a human centred approach to using generative AI.",
    "A 2024 Ofsted survey found that 87 per cent of further education teachers use AI every day.",
    "Jisc provides guidance and resources on AI for UK further and higher education.",
    "Generative AI tools can produce convincing references that do not exist."], bad: 2,
    why: "This statistic was invented for this game. A precise percentage, a named organisation and a year, with no link to a source, is a classic hallucination pattern. If you cannot find the original, do not use the figure.",
    flag: "A precise statistic with no traceable source" },
  { q: "Suggest some reading on AI in education.", s: [
    "Bowen, J. A. and Watson, C. E. (2024) Teaching with AI: A Practical Guide to a New Era of Human Learning. Johns Hopkins University Press.",
    "Hartley, J. and Osei, K. (2022) Prompting for Pedagogy: A Teacher's Handbook. Routledge.",
    "Holmes, W., Bialik, M. and Fadel, C. (2019) Artificial Intelligence in Education: Promises and Implications for Teaching and Learning. Center for Curriculum Redesign.",
    "Luckin, R. (2018) Machine Learning and Human Intelligence: The Future of Education for the 21st Century. UCL IOE Press.",
    "Selwyn, N. (2022) Education and Technology: Key Issues and Debates. 3rd edn. Bloomsbury."], bad: 1,
    why: "Hartley and Osei's handbook was invented for this game. It has a real publisher, plausible authors and a title that sounds right. The only reliable test is to look it up in a library catalogue.",
    flag: "Invented references with real publishers" }
];
let r, score, tries, found, flags;
const g = document.getElementById("game");
function start() { r = 0; score = 0; flags = []; round(); }
function round() {
  tries = 2; found = false; const R = ROUNDS[r];
  g.innerHTML = `<div class="row" style="justify-content:space-between"><span class="pill">Round ${r + 1} of ${ROUNDS.length}</span><span class="badge">Score ${score}</span><span class="lives" id="lives" aria-label="Guesses left">${"●".repeat(tries)}</span></div>
  <p style="margin:16px 0 8px"><strong>You asked:</strong> ${R.q}</p>
  <div class="aibox"><div class="who"><span class="dot" aria-hidden="true">AI</span>Assistant</div>
  <p style="margin:0">${R.s.map((t, k) => `<button class="sent" data-k="${k}">${t}</button>`).join(" ")}</p></div>
  <p class="small muted" style="margin-top:8px">Click or tap the sentence you think is wrong.</p><div id="fb"></div>`;
  g.querySelectorAll(".sent").forEach(b => b.onclick = () => pick(+b.dataset.k, b));
}
function pick(k, b) {
  const R = ROUNDS[r]; if (found || tries <= 0) return;
  if (k === R.bad) {
    found = true; const pts = tries === 2 ? 2 : 1; score += pts; b.classList.add("right");
    finish(true, pts);
  } else {
    tries--; b.classList.add("wrong"); b.disabled = true;
    document.getElementById("lives").textContent = "●".repeat(tries) || "○";
    if (tries === 0) { g.querySelector(`[data-k="${R.bad}"]`).classList.add("right"); finish(false, 0); }
    else document.getElementById("fb").innerHTML = `<div class="fb mid"><strong>That one is accurate.</strong>One more guess.</div>`;
  }
}
function finish(ok, pts) {
  const R = ROUNDS[r]; flags.push(R.flag);
  g.querySelectorAll(".sent").forEach(x => x.disabled = true);
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><strong>${ok ? `Found it, ${pts} point${pts > 1 ? "s" : ""}.` : "It slipped past you this time."}</strong>${R.why}</div>
  <p style="margin-top:12px"><span class="pill">Red flag</span> <strong>${R.flag}</strong></p>
  <button class="btn" id="next">${r + 1 < ROUNDS.length ? "Next round" : "See your results"}</button>`;
  document.getElementById("next").onclick = () => { r++; r < ROUNDS.length ? round() : end(); };
  document.getElementById("next").focus();
}
function end() {
  const max = ROUNDS.length * 2; if (score >= 9) AIE.confetti();
  AIE.set("hh-best", Math.max(AIE.get("hh-best", 0), score));
  g.innerHTML = `<span class="pill">Finished</span><div class="score" style="margin-top:10px">${score} / ${max}</div>
  <p><strong>${score >= 10 ? "A natural fact checker." : score >= 7 ? "Sharp eyes. Most of those would have got past a busy colleague." : "Hallucinations are hard to spot because they sound right. That is the lesson."}</strong></p>
  <h2>Your red flag checklist</h2><div class="grid g2">${ROUNDS.map(x => `<div class="card soft"><strong>${x.flag}</strong></div>`).join("")}</div>
  <div class="card accent" style="margin-top:16px"><strong>The habit to build.</strong> Treat every specific fact, figure, name, date and reference in AI output as unverified until you have checked it against something real.</div>
  <div class="row" style="margin-top:16px"><button class="btn" id="again">Play again</button><button class="btn ghost" id="copy">Copy the checklist</button></div>`;
  document.getElementById("again").onclick = start;
  document.getElementById("copy").onclick = () => AIE.copy("Hallucination red flags\n" + ROUNDS.map(x => "* " + x.flag).join("\n"), "Checklist copied");
}
start();
AIE.footer();
</script>
</body>
</html>
